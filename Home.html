<!DOCTYPE html>
<html>
<head>
<base target="_top">
<?!= styles ?>
</head>
<body>
<div class="band"></div>
<main>
  <img class="logo" id="logo" alt="" hidden>
  <p class="org" id="org" hidden></p>
  <h1 id="title">Questions welcome</h1>
  <p class="welcome" id="welcome" hidden></p>

  <div class="join">
    <p class="main" lang="en" id="joinEn"></p>
    <span id="joinLines"></span>
    <p class="quiet" id="anon">Questions are anonymous. You can ask in any language.</p>
  </div>

  <section class="staff" id="staff">
    <h2 data-w="home.staff.heading">For staff</h2>
    <div id="staffSignedIn" hidden>
      <ul id="sessions"></ul>
      <p class="quiet" id="noSessions" data-w="home.staff.none" hidden>No open sessions assigned to you.</p>
      <p class="quiet"><a id="adminLink" data-w="home.staff.admin" hidden>Open the admin page</a></p>
    </div>
    <p class="quiet" id="staffSignedOut" hidden></p>
  </section>
</main>
<footer id="footer" hidden></footer>

<?!= scripts ?>
<script>
  var BOOT = <?!= boot ?>;
  var brand = BOOT.brand;
  fillWords();


  // "Scan the code" in the site's languages, from UI_TEXT.home in Code.js.
  var JOIN = BOOT.text;
  (function () {
    var slot = $('joinLines');
    $('title').textContent = JOIN.en.title;
    $('anon').textContent = JOIN.en.anonymous;
    $('joinEn').textContent = JOIN.en.join;
    (BOOT.languages || ['en', 'ko', 'es']).forEach(function (code) {
      if (code === 'en' || !JOIN[code]) return;
      var p = document.createElement('p');
      p.lang = code;
      p.textContent = JOIN[code].join;
      slot.parentNode.insertBefore(p, slot);
    });
    slot.parentNode.removeChild(slot);
  })();

  if (brand.accent) document.documentElement.style.setProperty('--accent', brand.accent);
  if (brand.logo) {
    $('logo').src = brand.logo;
    $('logo').alt = brand.orgName;
    $('logo').hidden = false;
  }
  // Most logos already contain the name; show the text only when there is no logo.
  if (brand.orgName && !brand.logo) {
    $('org').textContent = brand.orgName;
    $('org').hidden = false;
  }
  if (brand.welcome) {
    $('welcome').textContent = brand.welcome;
    $('welcome').hidden = false;
  }
  if (brand.footer) {
    $('footer').textContent = brand.footer;
    $('footer').hidden = false;
  }

  if (BOOT.staff) {
    $('staffSignedIn').hidden = false;
    if (BOOT.adminUrl) {
      $('adminLink').href = BOOT.adminUrl;
      $('adminLink').hidden = false;
    }
    $('noSessions').hidden = BOOT.sessions.length > 0;
    BOOT.sessions.forEach(function (s) {
      var li = document.createElement('li');
      var name = document.createElement('div');
      name.textContent = (s.eventName ? s.eventName + ' — ' : '') + s.name + ' ';
      var status = document.createElement('span');
      status.textContent = W(s.status === 'active' ? 'home.session.active' : 'home.session.inactive');
      name.appendChild(status);
      li.appendChild(name);
      var links = document.createElement('div');
      links.className = 'links';
      [[W('home.link.present'), s.present], [W('home.link.queue'), s.moderate]].forEach(function (pair) {
        var a = document.createElement('a');
        a.textContent = pair[0];
        a.href = pair[1];
        links.appendChild(a);
      });
      li.appendChild(links);
      $('sessions').appendChild(li);
    });
  } else {
    // One sentence with the link inside it, so another language can put it anywhere.
    var link = el('a', null, W('home.staff.signInLink'));
    link.id = 'signIn';
    link.href = BOOT.signInUrl;
    var said = W('home.staff.signIn', { domain: '@' + BOOT.domain }).split('{link}');
    var where = $('staffSignedOut');
    where.appendChild(document.createTextNode(said[0]));
    where.appendChild(link);
    where.appendChild(document.createTextNode(said[1] || ''));
    where.hidden = false;
  }
</script>
</body>
</html>
