<!DOCTYPE html>
<html>
<head>
<base target="_top">
<?!= styles ?>
<style>
  body {
    padding: 24px 20px 48px;
    font-size: 17px;
    max-width: 34rem;
    margin-inline: auto;
    background: var(--card);
  }
  /* A soft accent wash behind the top of the page. */
  html { background: var(--card); }
  body::before { content: ""; position: fixed; inset: 0 0 auto 0; height: 180px; z-index: -1; background: linear-gradient(180deg, var(--action-soft), rgba(255,255,255,0)); }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; color: var(--muted); font-size: 0.9rem; }
  .brand img { max-height: 44px; max-width: 180px; }
  .langs { display: flex; gap: 6px; margin-bottom: 20px; }
  .langs button {
    width: auto;
    margin: 0;
    padding: 6px 14px;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--muted);
    background: var(--card);
    border: 1px solid var(--rule-strong);
    border-radius: 999px;
    box-shadow: none;
  }
  .langs button[aria-pressed="true"] {
    color: var(--action-ink);
    background: var(--ink);
    border-color: var(--ink);
    font-weight: 600;
  }

  h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 0.95rem; }

  textarea {
    width: 100%;
    min-height: 8.5rem;
    padding: 14px;
    font: inherit;
    color: inherit;
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius);
    resize: vertical;
    box-shadow: var(--shadow-sm);
  }
  textarea:disabled { background: var(--paper); color: var(--muted); }

  .meter { display: flex; justify-content: flex-end; color: var(--muted); font-size: 0.85rem; padding-top: 6px; }
  .meter.over { color: var(--stop); }

  button {
    width: 100%;
    margin-top: 14px;
    padding: 15px;
    font-weight: 600;
    color: var(--action-ink);
    background: var(--action);
    border: 0;
    border-radius: var(--radius);
    box-shadow: 0 6px 16px -6px var(--action-ring), inset 0 1px 0 rgba(255, 255, 255, 0.14);
  }
  button:hover { background: var(--action); filter: brightness(1.07); }
  button:disabled { background: #aab3bb; opacity: 1; box-shadow: none; filter: none; }

  .note { margin-top: 20px; padding: 14px 16px; border-left: 4px solid var(--rule); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; background: var(--paper); font-size: 0.95rem; animation: qd-rise 0.2s var(--ease); }
  .note.good { border-color: var(--action); }
  .note.hold { border-color: var(--hold); }
  .note.stop { border-color: var(--stop); }
  .note p { margin: 0; }
  .note p + p { margin-top: 6px; }

  .welcome { margin: 0 0 18px; }
  .now { margin: 0 0 20px; padding: 14px 16px; border-radius: var(--radius); background: var(--action); color: var(--action-ink, #fff); box-shadow: 0 8px 20px -10px var(--action-ring); }
  .now small { display: block; text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.72rem; font-weight: 700; opacity: 0.85; }
  .now strong { display: block; font-size: 1.1rem; line-height: 1.3; }
  .now span { display: block; margin-top: 4px; font-size: 0.95rem; }
  .topics { margin-top: 32px; border-top: 1px solid var(--rule); padding-top: 16px; }
  .topics h2 { font-size: 0.95rem; font-weight: 600; margin: 0 0 4px; color: var(--muted); }
  .topics .hint { color: var(--muted); font-size: 0.88rem; margin: 0 0 12px; }
  .topics ul { list-style: none; padding: 0; }
  .topics li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eef1f3; }
  .topics li .name { flex: 1; }
  .topics li .count { display: block; color: var(--muted); font-size: 0.82rem; }
  .topics li.done .name { color: var(--muted); }
  .topics button.metoo { width: auto; margin: 0; padding: 7px 14px; border-radius: 999px; box-shadow: none; font-size: 0.9rem; font-weight: 600; background: #fff; color: var(--action); border: 1px solid var(--action); white-space: nowrap; }
  .topics button.metoo[aria-pressed="true"] { background: var(--action); color: var(--action-ink, #fff); }
  footer.foot { margin-top: 36px; color: var(--muted); font-size: 0.85rem; text-align: center; }
  .sent { margin-top: 32px; border-top: 1px solid var(--rule); padding-top: 16px; }
  .sent h2 { font-size: 0.95rem; font-weight: 600; margin: 0 0 10px; color: var(--muted); }
  .sent li { margin-bottom: 10px; color: var(--muted); }
  ul { padding-left: 20px; margin: 0; }
</style>
</head>
<body>

<div class="brand" id="brand" hidden>
  <img id="logo" alt="" hidden>
  <span id="org"></span>
</div>

<nav class="langs" id="langs" aria-label="Language">
  <button type="button" data-lang="en" lang="en">English</button>
  <button type="button" data-lang="ko" lang="ko">한국어</button>
  <button type="button" data-lang="es" lang="es">Español</button>
</nav>

<div class="now" id="now" hidden><small id="nowTag">Now answering</small><strong id="nowText"></strong><span id="nowMerged" hidden></span></div>

<h1 id="heading">Questions for the panel</h1>
<p class="sub" id="sub">Your question goes to the facilitator. Your name is not attached.</p>
<p class="welcome" id="welcome" hidden></p>

<label for="q" class="visually-hidden" style="position:absolute;left:-9999px">Your question</label>
<textarea id="q" placeholder="What would you like to ask?" maxlength="400"></textarea>
<div class="meter" id="meter">0 / 300</div>

<button id="send" disabled>Send question</button>

<div class="note" id="note" hidden><p id="noteText"></p></div>

<div class="sent" id="sent" hidden>
  <h2 id="sentHeading">You have asked</h2>
  <ul id="sentList"></ul>
</div>

<section class="topics" id="topics" hidden>
  <h2 id="topicsHeading">What people are asking about</h2>
  <p class="hint" id="topicsHint">Tap Me too on anything you also want answered.</p>
  <ul id="topicList"></ul>
</section>

<footer class="foot" id="footer" hidden></footer>

<script>
  var STRINGS = {
    en: {
      sub: 'Your question goes to the facilitator. Your name is not attached.',
      placeholder: 'What would you like to ask?',
      send: 'Send question', sending: 'Sending…',
      sent: 'Sent. The facilitator has it.',
      cooldown: 'You have already asked a question in the last few minutes.',
      again: 'You can ask another question now.',
      nextIn: 'Next question in ',
      expiredBtn: 'Scan the code again',
      expired: 'This link has expired. Scan the code on the screen in the room.',
      linkExpiredBtn: 'Link expired',
      linkExpired: 'This link is no longer valid. Ask the organizer for a new one.',
      notFound: 'This link is not valid. Scan the code on the screen in the room.',
      inactiveBtn: 'Not taking questions right now',
      inactive: 'This session is not taking questions right now. Try again in a little while.',
      endedBtn: 'Session ended',
      ended: 'This session has ended. Thank you for your questions.',
      closedBtn: 'Questions are closed',
      closed: 'The facilitator has closed question submission.',
      busy: 'A lot of questions are arriving at once. Try again in a moment.',
      short: 'That is a bit short — add a few more words.',
      long: 'Too long. Trim it to {n} characters.',
      failed: 'That did not send. Check your connection and try again.',
      youAsked: 'You have asked',
      nowAnswering: 'Now answering',
      topicsHeading: 'What people are asking about',
      topicsHint: 'Tap Me too on anything you also want answered.',
      meToo: 'Me too',
      people: '{n} people',
      person: '1 person',
      answered: 'Answered'
    },
    ko: {
      sub: '질문은 진행자에게 전달됩니다. 이름은 표시되지 않습니다.',
      placeholder: '무엇을 질문하시겠습니까?',
      send: '질문 보내기', sending: '보내는 중…',
      sent: '전송되었습니다. 진행자가 확인합니다.',
      cooldown: '최근 몇 분 이내에 이미 질문을 보내셨습니다.',
      again: '이제 다른 질문을 보낼 수 있습니다.',
      nextIn: '다음 질문까지 ',
      expiredBtn: '코드를 다시 스캔하세요',
      expired: '이 링크는 만료되었습니다. 화면의 코드를 다시 스캔해 주세요.',
      linkExpiredBtn: '링크 만료',
      linkExpired: '이 링크는 더 이상 유효하지 않습니다. 주최자에게 새 링크를 요청해 주세요.',
      notFound: '유효하지 않은 링크입니다. 화면의 코드를 스캔해 주세요.',
      inactiveBtn: '지금은 질문을 받지 않습니다',
      inactive: '이 세션은 지금 질문을 받지 않습니다. 잠시 후 다시 시도해 주세요.',
      endedBtn: '세션이 종료되었습니다',
      ended: '이 세션은 종료되었습니다. 질문해 주셔서 감사합니다.',
      closedBtn: '질문이 마감되었습니다',
      closed: '진행자가 질문 접수를 마감했습니다.',
      busy: '질문이 한꺼번에 많이 들어오고 있습니다. 잠시 후 다시 시도해 주세요.',
      short: '조금 짧습니다. 몇 마디 더 적어 주세요.',
      long: '너무 깁니다. {n}자 이내로 줄여 주세요.',
      failed: '전송되지 않았습니다. 연결을 확인한 후 다시 시도해 주세요.',
      youAsked: '보낸 질문',
      nowAnswering: '지금 답변 중',
      topicsHeading: '사람들이 묻는 주제',
      topicsHint: '답변을 듣고 싶은 주제에 "저도요"를 눌러 주세요.',
      meToo: '저도요',
      people: '{n}명',
      person: '1명',
      answered: '답변 완료'
    },
    es: {
      sub: 'Tu pregunta llega al moderador. Tu nombre no se adjunta.',
      placeholder: '¿Qué te gustaría preguntar?',
      send: 'Enviar pregunta', sending: 'Enviando…',
      sent: 'Enviada. El moderador ya la tiene.',
      cooldown: 'Ya enviaste una pregunta hace unos minutos.',
      again: 'Ya puedes enviar otra pregunta.',
      nextIn: 'Próxima pregunta en ',
      expiredBtn: 'Escanea el código otra vez',
      expired: 'Este enlace caducó. Vuelve a escanear el código de la pantalla.',
      linkExpiredBtn: 'Enlace caducado',
      linkExpired: 'Este enlace ya no es válido. Pide uno nuevo a quien organiza.',
      notFound: 'Este enlace no es válido. Escanea el código de la pantalla.',
      inactiveBtn: 'No recibe preguntas ahora',
      inactive: 'Esta sesión no está recibiendo preguntas en este momento. Inténtalo de nuevo en un rato.',
      endedBtn: 'Sesión terminada',
      ended: 'Esta sesión terminó. Gracias por tus preguntas.',
      closedBtn: 'Preguntas cerradas',
      closed: 'El moderador cerró el envío de preguntas.',
      busy: 'Están llegando muchas preguntas a la vez. Inténtalo en un momento.',
      short: 'Es un poco corta: añade algunas palabras más.',
      long: 'Demasiado larga. Redúcela a {n} caracteres.',
      failed: 'No se envió. Revisa tu conexión e inténtalo de nuevo.',
      youAsked: 'Has preguntado',
      nowAnswering: 'Respondiendo ahora',
      topicsHeading: 'Sobre qué pregunta la gente',
      topicsHint: 'Toca "Yo también" en lo que también quieras que se responda.',
      meToo: 'Yo también',
      people: '{n} personas',
      person: '1 persona',
      answered: 'Respondida'
    }
  };

  var LANG_KEY = 'qd.lang';
  var lang = 'en';

  function T(key) {
    return (STRINGS[lang] && STRINGS[lang][key]) || STRINGS.en[key];
  }

  function setLang(next) {
    lang = STRINGS[next] ? next : 'en';
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    document.documentElement.lang = lang;

    document.getElementById('sub').textContent = T('sub');
    document.getElementById('q').placeholder = T('placeholder');
    document.getElementById('sentHeading').textContent = T('youAsked');
    document.getElementById('topicsHeading').textContent = T('topicsHeading');
    document.getElementById('topicsHint').textContent = T('topicsHint');
    document.getElementById('nowTag').textContent = T('nowAnswering');
    if (typeof renderTopics === 'function' && lastTopics) renderTopics(lastTopics);
    if (!q.disabled && !ticker) send.textContent = T('send');
    // Locked pages and notes already on screen switch language too.
    if (typeof stopped !== 'undefined' && stopped) refuse(stopped);
    else if (typeof noteKey !== 'undefined' && noteKey && !note.hidden) sayKey(noteKey, noteTone);

    var buttons = document.querySelectorAll('.langs button');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute('aria-pressed', buttons[i].dataset.lang === lang);
    }
  }

  // Session and credential come from the server, which sees the real URL. The page
  // itself runs in a sandboxed iframe, so window.location never carries ?s= or ?t=.
  var BOOT = <?!= boot ?>;
  var sid = BOOT.sid;
  var credential = BOOT.credential;
  var access = 'room';
  var KEY = 'qd.device.' + sid;
  var deviceId = null;
  var maxLength = 300;
  var ticker = null;

  var q = document.getElementById('q');
  var send = document.getElementById('send');
  var meter = document.getElementById('meter');
  var note = document.getElementById('note');
  var noteText = document.getElementById('noteText');

  var noteKey = null, noteTone = '';
  var stopped = null;   // why the page is locked (closed, inactive, ended, …), or null

  function say(text, tone) {
    noteKey = null;
    noteText.textContent = text;
    note.className = 'note ' + (tone || '');
    note.hidden = false;
  }

  /** A note from STRINGS, remembered so a language switch can re-translate it. */
  function sayKey(key, tone) {
    say(T(key), tone);
    noteKey = key;
    noteTone = tone;
  }

  function lock(reason) {
    q.disabled = true;
    send.disabled = true;
    send.textContent = reason;
  }

  function refuse(reason) {
    stopped = reason;
    if (reason === 'ended') {
      clearInterval(ticker); clearInterval(syncTimer); ticker = null;
      lock(T('endedBtn')); sayKey('ended', 'stop');
    }
    else if (reason === 'inactive') { lock(T('inactiveBtn')); sayKey('inactive', 'hold'); }
    else if (reason === 'closed') { lock(T('closedBtn')); sayKey('closed', 'stop'); }
    else if (reason === 'notFound') { lock(T('expiredBtn')); sayKey('notFound', 'stop'); }
    else if (access === 'link') { lock(T('linkExpiredBtn')); sayKey('linkExpired', 'stop'); }
    else { lock(T('expiredBtn')); sayKey('expired', 'stop'); }
  }

  /** Follows the session while the page is open: paused, resumed, started or ended. */
  function followSession(status, open) {
    if (status === 'ended') { if (stopped !== 'ended') refuse('ended'); return; }
    if (stopped === 'closed' || stopped === 'inactive') {
      if (status === 'active' && open) {
        stopped = null;
        q.disabled = false;
        send.textContent = T('send');
        sayKey('again', 'good');
        updateMeter();
      } else if (status === 'active' && stopped === 'inactive') {
        refuse('closed');
      }
      return;
    }
    if (stopped || ticker) return;   // a countdown ends on its own; other locks need a new link
    if (status !== 'active') refuse('inactive');
    else if (!open) refuse('closed');
  }

  var remaining = 0;
  var syncTimer = null;

  function countdown(seconds, afterSend) {
    clearInterval(ticker);
    remaining = seconds;
    if (afterSend) q.value = '';   // a changed wait mid-typing keeps what they wrote
    q.disabled = true;
    send.disabled = true;
    updateMeter();

    function tick() {
      if (remaining <= 0) {
        clearInterval(ticker);
        clearInterval(syncTimer);
        ticker = null;
        if (stopped) return;
        q.disabled = false;
        send.textContent = T('send');
        updateMeter();
        sayKey('again', 'good');
        return;
      }
      var m = Math.floor(remaining / 60), s = remaining % 60;
      send.textContent = T('nextIn') + m + ':' + (s < 10 ? '0' : '') + s;
      remaining--;
    }
    tick();
    ticker = setInterval(tick, 1000);

    // The facilitator can change the wait mid-session; follow the server's number.
    clearInterval(syncTimer);
    syncTimer = setInterval(function () {
      google.script.run.withSuccessHandler(function (state) {
        if (state && state.found) syncCooldown(state.cooldownRemaining);
      }).getSessionState(sid, deviceId);
    }, 15000);
  }

  function syncCooldown(serverSeconds) {
    if (typeof serverSeconds !== 'number') return;
    if (ticker) {
      if (Math.abs(serverSeconds - remaining) > 2) remaining = serverSeconds;
    } else if (serverSeconds > 0 && !q.disabled && !stopped) {
      countdown(serverSeconds, false);
    }
  }

  function updateMeter() {
    var n = q.value.trim().length;
    meter.textContent = n + ' / ' + maxLength;
    meter.className = n > maxLength ? 'meter over' : 'meter';
    if (!q.disabled) send.disabled = n < 5 || n > maxLength;
  }

  q.addEventListener('input', updateMeter);

  send.addEventListener('click', function () {
    send.disabled = true;
    send.textContent = T('sending');
    var text = q.value;

    function recover(message) {
      say(message, 'hold');
      send.textContent = T('send');
      updateMeter();
    }

    google.script.run
      .withSuccessHandler(function (res) {
        if (res.ok) {
          addSent(text);
          sayKey('sent', 'good');
          if (res.cooldownSeconds > 0) {
            countdown(res.cooldownSeconds, true);
          } else {
            q.value = '';          // no wait: keep "Sent" showing and let them ask again
            send.textContent = T('send');
            updateMeter();
          }
          return;
        }
        if (res.reason === 'cooldown') {
          sayKey('cooldown', 'hold');
          countdown(res.waitSeconds || 60, false);
        } else if (['expired', 'closed', 'ended', 'inactive', 'notFound'].indexOf(res.reason) !== -1) {
          refuse(res.reason);
        } else if (res.reason === 'busy') {
          recover(T('busy'));
        } else if (res.reason === 'tooShort') {
          recover(T('short'));
        } else if (res.reason === 'tooLong') {
          recover(T('long').replace('{n}', maxLength));
        }
      })
      .withFailureHandler(function () {
        say(T('failed'), 'stop');
        send.textContent = T('send');
        updateMeter();
      })
      .submitQuestion(sid, deviceId, text, credential);
  });

  function addSent(text) {
    var box = document.getElementById('sent');
    var li = document.createElement('li');
    li.textContent = text;
    document.getElementById('sentList').appendChild(li);
    box.hidden = false;
  }

  function applyBrand() {
    var brand = BOOT.brand;
    if (brand.welcome) {
      document.getElementById('welcome').textContent = brand.welcome;
      document.getElementById('welcome').hidden = false;
    }
    if (brand.footer) {
      document.getElementById('footer').textContent = brand.footer;
      document.getElementById('footer').hidden = false;
    }
    if (brand.accent) {
      document.documentElement.style.setProperty('--action', brand.accent);
      // Light accents get dark button text so the label stays readable.
      var hex = brand.accent.replace('#', '');
      var r = parseInt(hex.substr(0, 2), 16), g = parseInt(hex.substr(2, 2), 16), b = parseInt(hex.substr(4, 2), 16);
      if ((r * 299 + g * 587 + b * 114) / 1000 > 150) {
        var style = document.createElement('style');
        style.textContent = '#send:not(:disabled) { color: #16202b; }';
        document.documentElement.style.setProperty('--action-ink', '#16202b');
        document.head.appendChild(style);
      }
    }
    if (!brand.logo && !brand.orgName) return;
    document.getElementById('brand').hidden = false;
    // Most logos already contain the name; show the text only when there is no logo.
    document.getElementById('org').textContent = brand.logo ? '' : brand.orgName;
    if (brand.logo) {
      var logo = document.getElementById('logo');
      logo.src = brand.logo;
      logo.alt = brand.orgName;
      logo.hidden = false;
    }
  }

  var lastTopics = null;
  var topicTimer = null;

  function labelFor(labels) {
    return (labels && (labels[lang] || labels.en)) || '';
  }

  function renderTopics(res) {
    lastTopics = res;
    var now = res.nowAnswering;
    document.getElementById('now').hidden = !now;
    if (now) {
      document.getElementById('nowText').textContent = labelFor(now.labels);
      var merged = document.getElementById('nowMerged');
      merged.hidden = !now.merged;
      if (now.merged) merged.textContent = labelFor(now.merged);
    }

    var list = document.getElementById('topicList');
    list.innerHTML = '';
    document.getElementById('topics').hidden = !res.topics.length;
    var canVote = res.status === 'active' && res.open;
    res.topics.forEach(function (t) {
      var li = document.createElement('li');
      if (t.answered) li.className = 'done';
      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = labelFor(t.labels);
      var count = document.createElement('span');
      count.className = 'count';
      count.textContent = (t.count === 1 ? T('person') : T('people').replace('{n}', t.count)) +
        (t.answered ? ' · ' + T('answered') : '');
      name.appendChild(count);
      li.appendChild(name);

      if (canVote && !t.answered) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'metoo';
        b.textContent = T('meToo') + (t.mine ? ' ✓' : '');
        b.setAttribute('aria-pressed', t.mine ? 'true' : 'false');
        b.onclick = function () {
          // Optimistic: flip now, reconcile with the server's answer.
          voteSeq++;
          t.mine = !t.mine;
          t.count += t.mine ? 1 : -1;
          renderTopics(lastTopics);
          google.script.run.withSuccessHandler(function (r) {
            if (!r.ok) { loadTopics(); return; }
          }).withFailureHandler(loadTopics).meToo(sid, deviceId, t.topic);
        };
        li.appendChild(b);
      }
      list.appendChild(li);
    });
  }

  var voteSeq = 0;   // bumps on every Me too tap

  function loadTopics() {
    if (!deviceId) return;
    var seqAtStart = voteSeq;
    google.script.run.withSuccessHandler(function (res) {
      if (!res.ok) return;
      syncCooldown(res.cooldownRemaining);
      followSession(res.status, res.open);
      // Read before a Me too tap landed: showing it would undo the tap on screen.
      if (seqAtStart !== voteSeq) return;
      renderTopics(res);
      if (res.status === 'ended') clearInterval(topicTimer);
    }).getTopics(sid, deviceId);
  }

  function startTopics() {
    loadTopics();
    clearInterval(topicTimer);
    topicTimer = setInterval(loadTopics, 15000);
  }

  function applyState(state) {
    access = state.access;
    document.getElementById('heading').textContent = state.heading;
    maxLength = state.maxLength;
    q.setAttribute('maxlength', String(maxLength + 100));
    startTopics();
    if (state.status !== 'active') { refuse(state.status === 'ended' ? 'ended' : 'inactive'); return; }
    if (!state.open) { refuse('closed'); return; }
    if (state.cooldownRemaining > 0) { countdown(state.cooldownRemaining, false); return; }
    updateMeter();
  }

  // Exchange the room token or link key for a device token, once per browser, per session.
  (function start() {
    applyBrand();

    var saved = null;
    try { saved = localStorage.getItem(LANG_KEY); } catch (e) {}
    setLang(saved || (navigator.language || 'en').slice(0, 2));

    document.getElementById('langs').addEventListener('click', function (e) {
      var button = e.target.closest('button[data-lang]');
      if (button) setLang(button.dataset.lang);
    });

    if (!sid) { refuse('notFound'); return; }

    try { deviceId = localStorage.getItem(KEY); } catch (e) { deviceId = null; }

    function claim() {
      google.script.run.withSuccessHandler(function (res) {
        if (!res.ok) { refuse(res.reason); return; }
        deviceId = res.deviceId;
        try { localStorage.setItem(KEY, deviceId); } catch (e) {}
        applyState(res.state);
      }).withFailureHandler(function () {
        say(T('failed'), 'stop');
      }).claimDevice(sid, credential);
    }

    if (!deviceId) { claim(); return; }

    google.script.run.withSuccessHandler(function (state) {
      if (!state.found) { refuse('notFound'); return; }
      access = state.access;
      // Device token lapsed (6h) or was never valid: join again if this URL still carries a credential.
      if (!state.deviceValid && state.status !== 'ended') {
        if (credential) { claim(); return; }
        refuse('expired');
        return;
      }
      applyState(state);
    }).withFailureHandler(function () {
      say(T('failed'), 'stop');
    }).getSessionState(sid, deviceId);
  })();
</script>
