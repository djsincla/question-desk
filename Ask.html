<!DOCTYPE html>
<html>
<head>
<base target="_top">
<?!= styles ?>
</head>
<body>

<div class="brand" id="brand" hidden>
  <img id="logo" alt="" hidden>
  <span id="org"></span>
</div>

<nav class="langs" id="langs" aria-label="Language">
  <!-- Language buttons are added from the session's languages (BOOT.languages). -->
  <button type="button" id="bigText" class="size" aria-pressed="false" title="Larger text"><span aria-hidden="true">A+</span><span class="sr" id="bigTextLabel">Larger text</span></button>
</nav>

<div class="now" id="now" hidden role="status" aria-live="polite"><small id="nowTag">Now answering</small><strong id="nowText"></strong><span id="nowMerged" hidden></span></div>

<h1 id="heading">Questions for the panel</h1>
<p class="sub" id="sub">Your question goes to the facilitator. Your name is not attached.</p>
<p class="welcome" id="welcome" hidden></p>

<label for="q" class="sr" id="qLabel">Your question</label>
<textarea id="q" placeholder="What would you like to ask?" maxlength="400"></textarea>
<div class="meter" id="meter">0 / 300</div>

<button id="send" disabled>Send question</button>

<div class="note" id="note" hidden role="status" aria-live="polite"><p id="noteText"></p></div>

<div class="sent" id="sent" hidden>
  <h2 id="sentHeading">You have asked</h2>
  <ul id="sentList"></ul>
</div>

<section class="topics" id="topics" hidden>
  <h2 id="topicsHeading">What people are asking about</h2>
  <p class="hint" id="topicsHint">Tap Me too on anything you also want answered.</p>
  <ul id="topicList"></ul>
</section>

<footer class="foot" id="footer" hidden></footer>

<script>
  var BOOT = <?!= boot ?>;
  // Page text in every language (UI_TEXT.ask in Code.js).
  var STRINGS = BOOT.text;

  var LANG_KEY = 'qd.lang';
  var lang = 'en';

  function T(key) {
    return (STRINGS[lang] && STRINGS[lang][key]) || STRINGS.en[key];
  }

  function setLang(next) {
    lang = STRINGS[next] ? next : 'en';
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    document.documentElement.lang = lang;

    document.getElementById('sub').textContent = T('sub');
    document.getElementById('qLabel').textContent = T('questionLabel');
    document.getElementById('bigTextLabel').textContent = T('textSize');
    document.getElementById('bigText').title = T('textSize');
    document.getElementById('langs').setAttribute('aria-label', T('langLabel'));
    if (typeof renderSent === 'function') renderSent();
    document.getElementById('q').placeholder = T('placeholder');
    document.getElementById('sentHeading').textContent = T('youAsked');
    document.getElementById('topicsHeading').textContent = T('topicsHeading');
    document.getElementById('topicsHint').textContent = T('topicsHint');
    document.getElementById('nowTag').textContent = T('nowAnswering');
    if (typeof renderTopics === 'function' && lastTopics) renderTopics(lastTopics);
    if (!q.disabled && !ticker) send.textContent = T('send');
    // Locked pages and notes already on screen switch language too.
    if (typeof stopped !== 'undefined' && stopped) refuse(stopped);
    else if (typeof noteKey !== 'undefined' && noteKey && !note.hidden) sayKey(noteKey, noteTone);

    var buttons = document.querySelectorAll('.langs button[data-lang]');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute('aria-pressed', buttons[i].dataset.lang === lang);
    }
  }

  // Session and credential come from the server, which sees the real URL. The page
  // itself runs in a sandboxed iframe, so window.location never carries ?s= or ?t=.
  var sid = BOOT.sid;
  var credential = BOOT.credential;
  var access = 'room';
  var KEY = 'qd.device.' + sid;
  var deviceId = null;
  var maxLength = 300;
  var ticker = null;

  var q = document.getElementById('q');
  var send = document.getElementById('send');
  var meter = document.getElementById('meter');
  var note = document.getElementById('note');
  var noteText = document.getElementById('noteText');

  var noteKey = null, noteTone = '';
  var stopped = null;   // why the page is locked (closed, inactive, ended, …), or null

  function say(text, tone) {
    noteKey = null;
    noteText.textContent = text;
    note.className = 'note ' + (tone || '');
    note.hidden = false;
  }

  /** A note from STRINGS, remembered so a language switch can re-translate it. */
  function sayKey(key, tone) {
    say(T(key), tone);
    noteKey = key;
    noteTone = tone;
  }

  function lock(reason) {
    q.disabled = true;
    send.disabled = true;
    send.textContent = reason;
  }

  function refuse(reason) {
    stopped = reason;
    if (reason === 'ended') {
      clearInterval(ticker); clearInterval(syncTimer); ticker = null;
      lock(T('endedBtn')); sayKey('ended', 'stop');
    }
    else if (reason === 'inactive') { lock(T('inactiveBtn')); sayKey('inactive', 'hold'); }
    else if (reason === 'closed') { lock(T('closedBtn')); sayKey('closed', 'stop'); }
    else if (reason === 'notFound') { lock(T('expiredBtn')); sayKey('notFound', 'stop'); }
    else if (access === 'link') { lock(T('linkExpiredBtn')); sayKey('linkExpired', 'stop'); }
    else { lock(T('expiredBtn')); sayKey('expired', 'stop'); }
  }

  /** Follows the session while the page is open: paused, resumed, started or ended. */
  function followSession(status, open) {
    if (status === 'ended') { if (stopped !== 'ended') refuse('ended'); return; }
    if (stopped === 'closed' || stopped === 'inactive') {
      if (status === 'active' && open) {
        stopped = null;
        q.disabled = false;
        send.textContent = T('send');
        sayKey('again', 'good');
        updateMeter();
      } else if (status === 'active' && stopped === 'inactive') {
        refuse('closed');
      }
      return;
    }
    if (stopped || ticker) return;   // a countdown ends on its own; other locks need a new link
    if (status !== 'active') refuse('inactive');
    else if (!open) refuse('closed');
  }

  var remaining = 0;
  var syncTimer = null;

  function countdown(seconds, afterSend) {
    clearInterval(ticker);
    remaining = seconds;
    if (afterSend) q.value = '';   // a changed wait mid-typing keeps what they wrote
    q.disabled = true;
    send.disabled = true;
    updateMeter();

    function tick() {
      if (remaining <= 0) {
        clearInterval(ticker);
        clearInterval(syncTimer);
        ticker = null;
        if (stopped) return;
        q.disabled = false;
        send.textContent = T('send');
        updateMeter();
        sayKey('again', 'good');
        return;
      }
      var m = Math.floor(remaining / 60), s = remaining % 60;
      send.textContent = T('nextIn') + m + ':' + (s < 10 ? '0' : '') + s;
      remaining--;
    }
    tick();
    ticker = setInterval(tick, 1000);

    // The facilitator can change the wait mid-session; follow the server's number.
    clearInterval(syncTimer);
    syncTimer = setInterval(function () {
      google.script.run.withSuccessHandler(function (state) {
        if (state && state.found) syncCooldown(state.cooldownRemaining);
      }).getSessionState(sid, deviceId);
    }, 15000);
  }

  function syncCooldown(serverSeconds) {
    if (typeof serverSeconds !== 'number') return;
    if (ticker) {
      if (Math.abs(serverSeconds - remaining) > 2) remaining = serverSeconds;
    } else if (serverSeconds > 0 && !q.disabled && !stopped) {
      countdown(serverSeconds, false);
    }
  }

  function updateMeter() {
    var n = q.value.trim().length;
    meter.textContent = n + ' / ' + maxLength;
    meter.className = n > maxLength ? 'meter over' : 'meter';
    if (!q.disabled) send.disabled = n < 5 || n > maxLength;
  }

  q.addEventListener('input', updateMeter);

  send.addEventListener('click', function () {
    send.disabled = true;
    send.textContent = T('sending');
    var text = q.value;

    function recover(message) {
      say(message, 'hold');
      send.textContent = T('send');
      updateMeter();
    }

    google.script.run
      .withSuccessHandler(function (res) {
        if (res.ok) {
          addSent(text, res.id);
          sayKey('sent', 'good');
          if (res.cooldownSeconds > 0) {
            countdown(res.cooldownSeconds, true);
          } else {
            q.value = '';          // no wait: keep "Sent" showing and let them ask again
            send.textContent = T('send');
            updateMeter();
          }
          return;
        }
        if (res.reason === 'cooldown') {
          sayKey('cooldown', 'hold');
          countdown(res.waitSeconds || 60, false);
        } else if (['expired', 'closed', 'ended', 'inactive', 'notFound'].indexOf(res.reason) !== -1) {
          refuse(res.reason);
        } else if (res.reason === 'busy') {
          recover(T('busy'));
        } else if (res.reason === 'tooShort') {
          recover(T('short'));
        } else if (res.reason === 'tooLong') {
          recover(T('long').replace('{n}', maxLength));
        }
      })
      .withFailureHandler(function () {
        say(T('failed'), 'stop');
        send.textContent = T('send');
        updateMeter();
      })
      .submitQuestion(sid, deviceId, text, credential);
  });

  // Questions this phone sent, kept on the phone so "Answered" can show next to them.
  var SENT_KEY = 'qd.sent.' + sid;
  var sentItems = [];
  try { sentItems = JSON.parse(localStorage.getItem(SENT_KEY) || '[]') || []; } catch (e) { sentItems = []; }
  var answeredIds = {};

  function renderSent() {
    var list = document.getElementById('sentList');
    list.innerHTML = '';
    sentItems.forEach(function (item) {
      var li = document.createElement('li');
      li.textContent = item.text;
      if (answeredIds[item.id]) {
        li.className = 'done';
        var tick = document.createElement('span');
        tick.className = 'tick';
        tick.textContent = '✓ ' + T('answeredYou');
        li.appendChild(tick);
      }
      list.appendChild(li);
    });
    document.getElementById('sent').hidden = !sentItems.length;
  }

  function addSent(text, id) {
    sentItems.push({ id: id || '', text: text });
    try { localStorage.setItem(SENT_KEY, JSON.stringify(sentItems.slice(-20))); } catch (e) {}
    renderSent();
  }

  function markAnswered(ids) {
    var fresh = false;
    (ids || []).forEach(function (id) {
      if (answeredIds[id]) return;
      answeredIds[id] = true;
      if (sentItems.some(function (item) { return item.id === id; })) fresh = true;
    });
    renderSent();
    if (fresh && !stopped && !ticker) sayKey('answeredNote', 'good');
  }

  function applyBrand() {
    var brand = BOOT.brand;
    if (brand.welcome) {
      document.getElementById('welcome').textContent = brand.welcome;
      document.getElementById('welcome').hidden = false;
    }
    if (brand.footer) {
      document.getElementById('footer').textContent = brand.footer;
      document.getElementById('footer').hidden = false;
    }
    if (brand.accent) {
      document.documentElement.style.setProperty('--action', brand.accent);
      // Light accents get dark button text so the label stays readable.
      var hex = brand.accent.replace('#', '');
      var r = parseInt(hex.substr(0, 2), 16), g = parseInt(hex.substr(2, 2), 16), b = parseInt(hex.substr(4, 2), 16);
      if ((r * 299 + g * 587 + b * 114) / 1000 > 150) {
        var style = document.createElement('style');
        style.textContent = '#send:not(:disabled) { color: #16202b; }';
        document.documentElement.style.setProperty('--action-ink', '#16202b');
        document.head.appendChild(style);
      }
    }
    if (!brand.logo && !brand.orgName) return;
    document.getElementById('brand').hidden = false;
    // Most logos already contain the name; show the text only when there is no logo.
    document.getElementById('org').textContent = brand.logo ? '' : brand.orgName;
    if (brand.logo) {
      var logo = document.getElementById('logo');
      logo.src = brand.logo;
      logo.alt = brand.orgName;
      logo.hidden = false;
    }
  }

  var lastTopics = null;
  var topicTimer = null;

  function labelFor(labels) {
    return (labels && (labels[lang] || labels.en)) || '';
  }

  function renderTopics(res) {
    lastTopics = res;
    var now = res.nowAnswering;
    document.getElementById('now').hidden = !now;
    if (now) {
      document.getElementById('nowText').textContent = labelFor(now.labels);
      var merged = document.getElementById('nowMerged');
      merged.hidden = !now.merged;
      if (now.merged) merged.textContent = labelFor(now.merged);
    }

    var list = document.getElementById('topicList');
    list.innerHTML = '';
    document.getElementById('topics').hidden = !res.topics.length;
    var canVote = res.status === 'active' && res.open;
    res.topics.forEach(function (t) {
      var li = document.createElement('li');
      if (t.answered) li.className = 'done';
      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = labelFor(t.labels);
      var count = document.createElement('span');
      count.className = 'count';
      count.textContent = (t.count === 1 ? T('person') : T('people').replace('{n}', t.count)) +
        (t.answered ? ' · ' + T('answered') : '');
      name.appendChild(count);
      li.appendChild(name);

      if (canVote && !t.answered) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'metoo';
        b.textContent = T('meToo') + (t.mine ? ' ✓' : '');
        b.setAttribute('aria-pressed', t.mine ? 'true' : 'false');
        b.onclick = function () {
          // Optimistic: flip now, reconcile with the server's answer.
          voteSeq++;
          t.mine = !t.mine;
          t.count += t.mine ? 1 : -1;
          renderTopics(lastTopics);
          google.script.run.withSuccessHandler(function (r) {
            if (!r.ok) { loadTopics(); return; }
          }).withFailureHandler(loadTopics).meToo(sid, deviceId, t.topic);
        };
        li.appendChild(b);
      }
      list.appendChild(li);
    });
  }

  var voteSeq = 0;   // bumps on every Me too tap

  function loadTopics() {
    if (!deviceId) return;
    var seqAtStart = voteSeq;
    google.script.run.withSuccessHandler(function (res) {
      if (!res.ok) return;
      syncCooldown(res.cooldownRemaining);
      followSession(res.status, res.open);
      markAnswered(res.mineAnswered);
      // Read before a Me too tap landed: showing it would undo the tap on screen.
      if (seqAtStart !== voteSeq) return;
      renderTopics(res);
      if (res.status === 'ended') clearInterval(topicTimer);
    }).getTopics(sid, deviceId);
  }

  function startTopics() {
    loadTopics();
    clearInterval(topicTimer);
    topicTimer = setInterval(loadTopics, 15000);
  }

  function applyState(state) {
    access = state.access;
    document.getElementById('heading').textContent = state.heading;
    maxLength = state.maxLength;
    q.setAttribute('maxlength', String(maxLength + 100));
    startTopics();
    if (state.status !== 'active') { refuse(state.status === 'ended' ? 'ended' : 'inactive'); return; }
    if (!state.open) { refuse('closed'); return; }
    if (state.cooldownRemaining > 0) { countdown(state.cooldownRemaining, false); return; }
    updateMeter();
  }

  // Exchange the room token or link key for a device token, once per browser, per session.
  (function start() {
    applyBrand();

    // The session's languages (its event's choice), in its order; English is always first.
    var offered = (BOOT.languages && BOOT.languages.length ? BOOT.languages : [{ code: 'en', native: 'English' }])
      .filter(function (l) { return STRINGS[l.code]; });
    var nav = document.getElementById('langs');
    offered.forEach(function (l) {
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('data-lang', l.code);
      b.setAttribute('lang', l.code);
      b.textContent = l.native;
      nav.insertBefore(b, document.getElementById('bigText'));
    });
    var codes = offered.map(function (l) { return l.code; });
    var saved = null;
    try { saved = localStorage.getItem(LANG_KEY); } catch (e) {}
    var phone = (navigator.language || 'en').slice(0, 2).toLowerCase();
    if (phone === 'fil') phone = 'tl';
    setLang(codes.indexOf(saved) !== -1 ? saved : codes.indexOf(phone) !== -1 ? phone : 'en');

    nav.addEventListener('click', function (e) {
      var button = e.target.closest('button[data-lang]');
      if (button) setLang(button.dataset.lang);
    });

    var big = false;
    try { big = localStorage.getItem('qd.bigText') === '1'; } catch (e) {}
    function applyBig() {
      document.documentElement.classList.toggle('big', big);
      document.getElementById('bigText').setAttribute('aria-pressed', big ? 'true' : 'false');
    }
    applyBig();
    document.getElementById('bigText').onclick = function () {
      big = !big;
      try { localStorage.setItem('qd.bigText', big ? '1' : '0'); } catch (e) {}
      applyBig();
    };

    if (!sid) { refuse('notFound'); return; }

    try { deviceId = localStorage.getItem(KEY); } catch (e) { deviceId = null; }

    function claim() {
      google.script.run.withSuccessHandler(function (res) {
        if (!res.ok) { refuse(res.reason); return; }
        deviceId = res.deviceId;
        try { localStorage.setItem(KEY, deviceId); } catch (e) {}
        applyState(res.state);
      }).withFailureHandler(function () {
        say(T('failed'), 'stop');
      }).claimDevice(sid, credential);
    }

    if (!deviceId) { claim(); return; }

    google.script.run.withSuccessHandler(function (state) {
      if (!state.found) { refuse('notFound'); return; }
      access = state.access;
      // Device token lapsed (6h) or was never valid: join again if this URL still carries a credential.
      if (!state.deviceValid && state.status !== 'ended') {
        if (credential) { claim(); return; }
        refuse('expired');
        return;
      }
      applyState(state);
    }).withFailureHandler(function () {
      say(T('failed'), 'stop');
    }).getSessionState(sid, deviceId);
  })();
</script>
</body>
</html>
