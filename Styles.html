<!--
   Every style for the Apps Script pages, in one file. page_() inlines it into each page
   where the page says "styles" (no extra request on venue wifi), keeping only the sections
   marked for that page: the shared section (design tokens and components) and the page's
   own section after it, which may override the shared rules. The room screen (Present) has
   only its own projector styles. Pages have no style blocks or style attributes of their own.
   The guest page and PowerPoint add-in (docs/) are separate sites with their own styles.

  Each section is a style element with a data-pages attribute naming its pages. Not comments:
  Apps Script strips comments when it reads this file, so comment markers never reach the server.
-->

<style data-pages="Admin Ask Denied Home Moderate Panel Sheet">
  [hidden] { display: none !important; }

  :root {
    --ink: #172230;
    --muted: #5d6877;
    --faint: #8a94a1;
    --rule: #e2e6eb;
    --rule-strong: #cfd5dc;
    --paper: #f5f7f9;
    --card: #ffffff;
    --action: #1b5e5a;          /* replaced by the brand accent at runtime */
    --accent: var(--action);
    --action-ink: #ffffff;
    --action-soft: #e8f1f0;
    --action-soft: color-mix(in srgb, var(--action) 10%, #fff);
    --action-ring: rgba(27, 94, 90, 0.28);
    --action-ring: color-mix(in srgb, var(--action) 32%, transparent);
    --stop: #a3321f;
    --stop-soft: #fbeeeb;
    --hold: #8a6d1f;
    --good: #2e7d5b;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.05);
    --shadow: 0 1px 3px rgba(16, 24, 40, 0.07), 0 1px 2px rgba(16, 24, 40, 0.04);
    --shadow-lg: 0 12px 32px rgba(16, 24, 40, 0.14), 0 2px 6px rgba(16, 24, 40, 0.06);
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    color: var(--ink);
    background: var(--paper);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  h1, h2, h3 { letter-spacing: -0.01em; }
  a { color: var(--action); text-underline-offset: 2px; }
  a:hover { text-decoration-thickness: 2px; }
  ::selection { background: var(--action-soft); }

  /* ---- buttons */
  button {
    font: inherit;
    font-weight: 500;
    padding: 7px 13px;
    border: 1px solid var(--rule-strong);
    background: var(--card);
    color: var(--ink);
    border-radius: var(--radius-sm);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: background-color 0.15s var(--ease), border-color 0.15s var(--ease), box-shadow 0.15s var(--ease), transform 0.08s var(--ease), color 0.15s var(--ease);
  }
  button:hover { background: var(--paper); border-color: var(--faint); }
  button:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }
  button:disabled { opacity: 0.5; cursor: default; box-shadow: none; }
  button.primary {
    background: var(--action);
    border-color: var(--action);
    color: var(--action-ink);
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.12);
  }
  button.primary:hover { background: var(--action); filter: brightness(1.08) saturate(1.05); border-color: var(--action); }
  button.danger { color: var(--stop); }
  button.danger:hover { background: var(--stop-soft); border-color: var(--stop); }
  button.danger-solid { background: var(--stop); border-color: var(--stop); color: #fff; }
  button.quiet { border-color: transparent; background: transparent; color: var(--muted); box-shadow: none; }
  button.quiet:hover { background: rgba(16, 24, 40, 0.05); color: var(--ink); border-color: transparent; }

  /* ---- form fields */
  input[type=text], input[type=email], input[type=number], input[type=url], input[type=search],
  input[type=datetime-local], select, textarea {
    font: inherit;
    color: inherit;
    padding: 8px 10px;
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius-sm);
    background: var(--card);
    box-shadow: inset 0 1px 1px rgba(16, 24, 40, 0.03);
    transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
  }
  input[type=color] { border: 1px solid var(--rule-strong); border-radius: var(--radius-sm); background: var(--card); padding: 2px; height: 2.2rem; cursor: pointer; }
  input:hover, select:hover, textarea:hover { border-color: var(--faint); }
  input[type=checkbox], input[type=radio] { accent-color: var(--action); }

  /* One focus ring everywhere, in the brand color: clear for keyboard users, quiet for clicks. */
  button:focus-visible, a:focus-visible, summary:focus-visible, select:focus-visible,
  input:focus-visible, textarea:focus-visible {
    outline: none;
    border-color: var(--action);
    box-shadow: 0 0 0 3px var(--action-ring);
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--action); box-shadow: 0 0 0 3px var(--action-ring); }

  /* ---- surfaces */
  .panel {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .pill {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    border-radius: 999px;
    padding: 2px 9px;
    background: var(--paper);
    color: var(--muted);
    border: 1px solid var(--rule);
  }
  .pill.active { background: var(--action-soft); color: var(--action); border-color: transparent; }
  .pill.active::before {
    content: "";
    display: inline-block;
    width: 6px; height: 6px;
    margin-right: 5px;
    border-radius: 50%;
    background: currentColor;
    vertical-align: 1px;
    animation: qd-pulse 2s ease-in-out infinite;
  }
  .pill.ended { background: var(--stop-soft); color: var(--stop); border-color: transparent; }
  .hint { color: var(--muted); }

  details > summary { cursor: pointer; }

  @keyframes qd-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  @keyframes qd-rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* Utilities: what used to be style attributes in the pages. !important keeps the priority
     those attributes had, so a page rule never overrides them. */
  .grow { flex: 1 !important; }
  .spread { justify-content: space-between !important; }
  .full-width { width: 100% !important; }
  .code-text { font-family: ui-monospace, Menlo, monospace !important; font-size: 0.8rem !important; }
  .flush { margin: 0 !important; }
  .flush-top { margin-top: 0 !important; }
  .flush-bottom { margin-bottom: 0 !important; }
  .flush-sides { margin-left: 0 !important; margin-right: 0 !important; }
  .space-above-8 { margin-top: 8px !important; }
  .space-above-10 { margin-top: 10px !important; }
  .space-above-12 { margin-top: 12px !important; }
  .space-above-14 { margin-top: 14px !important; }
  .space-below-10 { margin-bottom: 10px !important; }
  .space-below-14 { margin-bottom: 14px !important; }
  .space-below-16 { margin-bottom: 16px !important; }
  .tuck-up { margin: -6px 0 14px !important; }
  .indent { margin: 6px 0 0 24px !important; }
  .hex-input { width: 7rem !important; }
  .clickable { cursor: pointer !important; }
</style>

<style data-pages="Admin">
  /* Admin page */

     refresh that changes the page's height never shifts everything sideways. */
  html { overflow-y: scroll; scrollbar-gutter: stable; }

  nav.tabs button { border: 0; border-radius: var(--radius-sm) var(--radius-sm) 0 0; background: none; box-shadow: none; padding: 9px 14px; color: var(--muted); position: relative; white-space: nowrap; }
  nav.tabs button:hover { background: rgba(16, 24, 40, 0.04); color: var(--ink); }
  nav.tabs button::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--action); transform: scaleX(0); transition: transform 0.2s var(--ease); }
  nav.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; }
  nav.tabs button[aria-selected="true"]::after { transform: scaleX(1); }
  section[id^="tab-"]:not([hidden]) { animation: qd-rise 0.22s var(--ease); }

  input[type=text], input[type=email], input[type=number], input[type=url], input[type=datetime-local], textarea { width: 100%; }
  textarea { min-height: 5rem; resize: vertical; }
  label.field { display: block; margin-bottom: 14px; }
  label.field > span, .field-label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
  .hint { color: var(--muted); font-size: 0.85rem; margin-top: 3px; }
  .choice { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 6px; font-weight: 400; }

  .choice small { display: block; color: var(--muted); }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }

  .panel { padding: 18px; margin-bottom: 18px; }
  .panel.form { border-top: 3px solid var(--action); box-shadow: var(--shadow-lg); animation: qd-rise 0.22s var(--ease); }

  .session { border: 1px solid var(--rule); border-radius: var(--radius); margin-bottom: 12px; background: var(--card); box-shadow: var(--shadow-sm); transition: box-shadow 0.15s var(--ease), border-color 0.15s var(--ease); }
  .session:hover { box-shadow: var(--shadow); border-color: var(--rule-strong); }

  .linkrow { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .linkrow b { flex: 0 0 9rem; font-size: 0.85rem; }
  .linkrow input { flex: 1; font-size: 0.85rem; }
  .pill { vertical-align: 2px; margin-left: 6px; }

  ul.people { list-style: none; margin: 0 0 12px; padding: 0; }
  ul.people li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid #eef1f3; }
  .adder { display: flex; gap: 8px; }

  .logo-preview { display: flex; align-items: center; justify-content: center; min-height: 80px; border: 1px dashed var(--rule-strong); border-radius: var(--radius-sm); margin-bottom: 8px; padding: 10px; background: var(--paper); }
  .logo-preview img { max-height: 80px; max-width: 100%; }

  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 6px; max-width: 90vw; box-shadow: 0 4px 16px rgba(0,0,0,0.2); z-index: 20; }
  .toast.error { background: var(--stop); }

  .modal { position: fixed; inset: 0; background: rgba(15, 23, 32, 0.45); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); display: flex; align-items: flex-start; justify-content: center; padding: 8vh 16px; z-index: 10; }
  .modal .panel { width: 100%; max-width: 32rem; box-shadow: var(--shadow-lg); animation: qd-rise 0.2s var(--ease); }

  table.checks td:first-child { width: 1.5rem; font-weight: 700; }
  td.ok { color: var(--action); }

  pre.cmd { background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 10px; white-space: pre-wrap; word-break: break-all; font-size: 0.85rem; margin: 8px 0; }
  header { border-top: 4px solid var(--action); padding-top: 14px; }
  #dialog .panel { max-width: 30rem; }
  #dialogBody { margin: 0 0 14px; white-space: pre-line; }
  .typed { font-weight: 600; background: var(--paper); border: 1px solid var(--rule); border-radius: 3px; padding: 0 4px; }
  .session { display: flex; }
  .session .grip { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 4px; border-right: 1px solid var(--rule); background: var(--paper); border-radius: var(--radius) 0 0 var(--radius); }
  .session .grip .handle { cursor: grab; color: var(--muted); font-size: 1.1rem; line-height: 1; padding: 4px 6px; user-select: none; }
  .session .grip button { border: 0; background: none; box-shadow: none; padding: 2px 6px; color: var(--muted); font-size: 0.8rem; }
  .session .grip button:disabled { visibility: hidden; }
  .session .body { flex: 1; min-width: 0; }
  .session.dragging { opacity: 0.45; }
  /* Active sessions stand out: tinted with the brand accent and an accent edge. */
  .session.is-active { background: #eef6f4; box-shadow: inset 4px 0 0 var(--action); }
  .session.is-active { background: color-mix(in srgb, var(--action) 9%, #fff); border-color: color-mix(in srgb, var(--action) 45%, #fff); box-shadow: inset 4px 0 0 var(--action); }
  .session.is-active .grip { background: color-mix(in srgb, var(--action) 14%, #fff); }
  .session.is-ended { background: #fafbfb; }
  .session.is-ended h3 { color: var(--muted); }
  .session.drop-before { box-shadow: 0 -3px 0 var(--action); }
  .session.drop-after { box-shadow: 0 3px 0 var(--action); }

  /* Events group their sessions. */
  .event { border: 1px solid var(--rule); border-radius: calc(var(--radius) + 4px); margin-bottom: 20px; background: var(--card); box-shadow: var(--shadow); overflow: hidden; }
  .event-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 14px 16px; background: linear-gradient(180deg, var(--card), var(--paper)); box-shadow: inset 4px 0 0 var(--event-accent, var(--action)); }
  /* Collapse animates the height (0fr ↔ 1fr), so the page below slides instead of jumping. */
  .event-fold { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 0.24s var(--ease); }
  .event.collapsed .event-fold { grid-template-rows: 0fr; }

  details.more .menu button, details.more .menu a { display: block; width: 100%; text-align: left; border: 0; box-shadow: none; background: none; padding: 8px 10px; border-radius: var(--radius-sm); color: var(--ink); text-decoration: none; font-weight: 500; }

<style data-pages="Ask">
  /* participant page */
  body {
    padding: 24px 20px 48px;
    font-size: 17px;
    max-width: 34rem;
    margin-inline: auto;
    background: var(--card);
  }
  /* A soft accent wash behind the top of the page. */
  html { background: var(--card); }
  body::before { content: ""; position: fixed; inset: 0 0 auto 0; height: 180px; z-index: -1; background: linear-gradient(180deg, var(--action-soft), rgba(255,255,255,0)); }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; color: var(--muted); font-size: 0.9rem; }
  .brand img { max-height: 44px; max-width: 180px; }
  .langs { display: flex; gap: 6px; margin-bottom: 20px; }
  .langs button {
    width: auto;
    margin: 0;
    padding: 6px 14px;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--muted);
    background: var(--card);
    border: 1px solid var(--rule-strong);
    border-radius: 999px;
