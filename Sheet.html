<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<?!= styles ?>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
<div class="toolbar">
  <p id="intro"></p>
  <button type="button" class="primary" id="print" data-w="sheet.print">Print</button>
  <button type="button" id="images" data-w="sheet.download">Download QR images</button>
</div>
<div id="pages"></div>
<div class="save-these" id="saveThese" hidden></div>
<p class="skipped" id="skipped" hidden></p>

<?!= scripts ?>
<script>
  var BOOT = <?!= boot ?>;
  fillWords();
  var brand = BOOT.brand || {};
  // "Scan to ask" in each language, from UI_TEXT.screen in Code.js.
  var TEXT = BOOT.text;
  var langs = (BOOT.languages || ['en']).filter(function (c) { return TEXT[c]; });
  if (brand.accent) document.documentElement.style.setProperty('--action', brand.accent);



  /**
   * What is written under a downloaded code: the event and the session it belongs to. The
   * printed sheet doesn't need it — the page already says both, above the code.
   */
  function label(s) {
    return BOOT.eventName ? BOOT.eventName + ' — ' + s.name : s.name;
  }

  function qrSvg(url) {
    var scratch = document.createElement('div');
    var q = new QRCode(scratch, { text: url, width: 64, height: 64, correctLevel: QRCode.CorrectLevel.M });
    return qrArt(q._oQRCode, W('sheet.qr'));
  }

  var printable = BOOT.sessions.filter(function (s) { return s.url; });
  var roomOnly = BOOT.sessions.filter(function (s) { return !s.url; });
  document.title = W('sheet.pageTitle', { event: BOOT.eventName });
  document.getElementById('intro').textContent = printable.length
    ? Wn('sheet.intro', printable.length, { event: BOOT.eventName })
    : W('sheet.nothing', { event: BOOT.eventName });
  document.getElementById('print').hidden = !printable.length;

  printable.forEach(function (s) {
    var page = el('section', 'page');
    if (brand.logo) { var img = el('img', 'logo'); img.src = brand.logo; img.alt = brand.orgName || ''; page.appendChild(img); }
    else if (brand.orgName) page.appendChild(el('p', 'org', brand.orgName));
    page.appendChild(el('p', 'event', BOOT.eventName));
    page.appendChild(el('h1', null, s.name));
    if (s.heading) page.appendChild(el('p', 'heading', s.heading));
    var qr = el('div', 'qr');
    qr.appendChild(qrSvg(s.url));
    qr.firstChild.setAttribute('aria-label', W('sheet.qrFor', { name: s.name }));
    page.appendChild(qr);
    var scan = el('p', 'scan', TEXT.en.caption);
    langs.forEach(function (code) {
      if (code === 'en') return;
      var line = el('span', null, TEXT[code].caption);
      line.lang = code;
      scan.appendChild(line);
    });
    page.appendChild(scan);
    page.appendChild(el('p', 'anon', TEXT.en.anonymous));
    page.appendChild(el('p', 'link', s.url));
    document.getElementById('pages').appendChild(page);
  });

  if (roomOnly.length) {
    var skipped = document.getElementById('skipped');
    skipped.textContent = W('sheet.skipped', { names: roomOnly.map(function (s) { return s.name; }).join(', ') });
    skipped.hidden = false;
  }

  document.getElementById('print').onclick = function () { window.print(); };

  // ---------------------------------------------------------------- QR images

  /**
   * One PNG per session: the code with the event and session written under it, so a code
   * dropped into a slide or a poster still says what it is for. Drawn on a canvas from the
   * same SVG the sheet shows, at a size that stays sharp when printed.
   */
  function qrImage(s, done) {
    var SIZE = 1000;                 // the code itself
    var PAD = 60;                    // white margin around everything
    var CAPTION = 73;                // room under the code for the two lines
    var canvas = document.createElement('canvas');
    canvas.width = SIZE + PAD * 2;
    canvas.height = SIZE + PAD * 2 + CAPTION;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    var svg = qrSvg(s.url);
    svg.setAttribute('width', SIZE);
    svg.setAttribute('height', SIZE);
    var source = new XMLSerializer().serializeToString(svg);
    var image = new Image();
    image.onload = function () {
      ctx.drawImage(image, PAD, PAD, SIZE, SIZE);
      ctx.fillStyle = '#16202b';
      ctx.textAlign = 'center';
      ctx.font = 'bold 37px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.fillText(s.name, canvas.width / 2, SIZE + PAD + 39, canvas.width - PAD * 2);
      if (BOOT.eventName) {
        ctx.fillStyle = '#5c6874';
        ctx.font = '28px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.fillText(BOOT.eventName, canvas.width / 2, SIZE + PAD + 81, canvas.width - PAD * 2);
      }
      done(canvas.toDataURL('image/png'));
    };
    image.onerror = function () { done(''); };
    image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(source);
  }

  function fileName(s) {
    var name = (label(s) + '-qr').replace(/[^\w -]+/g, '').trim().replace(/\s+/g, '-');
    return (name || 'question-desk-qr') + '.png';
  }

  /**
   * Downloads them one at a time. A page in a sandboxed frame can't save files, so the images
   * are shown on the sheet instead when that happens: right-click, Save image.
   */
  var images = document.getElementById('images');
  images.hidden = !printable.length;
  images.onclick = function () {
    images.disabled = true;
    var at = 0;
    var saved = 0;
    (function next() {
      if (at >= printable.length) {
        images.disabled = false;
        images.textContent = W(saved ? 'sheet.download' : 'sheet.downloadFallback');
        return;
      }
      var s = printable[at++];
      qrImage(s, function (data) {
        if (data && save(data, fileName(s))) saved++;
        else if (data) show(s, data);
        setTimeout(next, 300);   // browsers refuse a burst of downloads
      });
    })();
  };

  function save(data, name) {
    try {
      var a = el('a');
      a.href = data;
      a.download = name;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      return typeof a.download === 'string';
    } catch (e) {
      return false;
    }
  }

  /** The fallback: the image on the page, ready to save or copy by hand. */
  function show(s, data) {
    var box = document.getElementById('saveThese');
    if (box.hidden) {
      box.hidden = false;
      box.appendChild(el('p', null, W('sheet.saveByHand')));
    }
    var img = el('img');
    img.src = data;
    img.alt = W('sheet.qrFor', { name: label(s) });
    img.title = fileName(s);
    box.appendChild(img);
  }
</script>
</body>
</html>
