<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<?!= styles ?>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  /* Printable QR sheets for an event's shareable-link sessions: one page each. */
  body { padding: 24px; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; max-width: 46rem; margin: 0 auto 20px; }
  .toolbar p { margin: 0; flex: 1 1 18rem; color: var(--muted); }
  .page {
    background: var(--card); max-width: 46rem; margin: 0 auto 24px; padding: 48px 40px;
    border-radius: var(--radius); box-shadow: var(--shadow); text-align: center;
    border-top: 8px solid var(--action);
  }
  .page img.logo { max-height: 70px; max-width: 280px; margin-bottom: 12px; }
  .page .org { color: var(--muted); margin: 0 0 4px; }
  .page .event { color: var(--muted); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 0.85rem; margin: 0 0 18px; }
  .page h1 { font-size: 2.2rem; line-height: 1.15; margin: 0 0 6px; }
  .page .heading { font-size: 1.2rem; color: var(--muted); margin: 0 0 26px; }
  .qr { display: inline-block; padding: 6px; background: #fff; border-radius: 16px; box-shadow: 0 0 0 6px var(--action); }
  .qr svg { display: block; width: 340px; height: 340px; }
  .scan { margin: 26px 0 0; font-size: 1.35rem; font-weight: 600; }
  .scan span { display: block; font-size: 1.05rem; font-weight: 500; color: var(--muted); margin-top: 4px; }
  .anon { margin: 18px 0 0; color: var(--muted); }
  .link { margin: 22px auto 0; font-size: 0.78rem; color: var(--faint); word-break: break-all; max-width: 34rem; }
  .skipped { max-width: 46rem; margin: 0 auto; color: var(--muted); }
  @media print {
    body { background: #fff; padding: 0; }
    .toolbar, .skipped { display: none !important; }
    .page { box-shadow: none; border-radius: 0; margin: 0; max-width: none; min-height: 100vh; page-break-after: always; break-after: page; }
    .page:last-of-type { page-break-after: auto; break-after: auto; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <p id="intro"></p>
  <button type="button" class="primary" id="print">Print</button>
</div>
<div id="pages"></div>
<p class="skipped" id="skipped" hidden></p>

<script>
  var BOOT = <?!= boot ?>;
  var brand = BOOT.brand || {};
  var SCAN = {
    en: ['Scan to ask a question', 'Questions are anonymous. Ask in any language.'],
    ko: ['질문하려면 스캔하세요', '질문은 익명입니다. 어떤 언어로도 질문할 수 있습니다.'],
    es: ['Escanea para preguntar', 'Las preguntas son anónimas. Pregunta en cualquier idioma.'],
    zh: ['扫码提问', '提问是匿名的，可以用任何语言提问。'],
    vi: ['Quét để đặt câu hỏi', 'Câu hỏi được ẩn danh. Hỏi bằng bất kỳ ngôn ngữ nào.'],
    tl: ['I-scan para magtanong', 'Hindi nagpapakilala ang mga tanong. Magtanong sa anumang wika.'],
    hy: ['Սկանավորեք՝ հարց տալու համար', 'Հարցերն անանուն են։ Հարցրեք ցանկացած լեզվով։']
  };
  var langs = (BOOT.languages || ['en']).filter(function (c) { return SCAN[c]; });
  if (brand.accent) document.documentElement.style.setProperty('--action', brand.accent);

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  // qr-art:start (same code in Present.html and Sheet.html; tests keep the two identical)
  /**
   * The QR pattern as one SVG with rounded dots: each module's outside corners are rounded,
   * inside corners are filled in, so neighbours flow together; the three finder "eyes" are
   * rounded squares. Only corners change, never which modules are dark, so it scans like
   * the square version (the browser tests decode it).
   */
  function qrArt(model, label) {
    var NS = 'http://www.w3.org/2000/svg';
    var n = model.getModuleCount();
    var k = 0.5;   // corner radius in modules: round ends on single dots
    function dark(r, c) { return r >= 0 && c >= 0 && r < n && c < n && model.isDark(r, c); }
    function eye(r, c) { return (r < 7 || r >= n - 7) && (c < 7 || c >= n - 7) && !(r >= n - 7 && c >= n - 7); }
    function arc(rad, sweep, x, y) { return 'A' + rad + ' ' + rad + ' 0 0 ' + sweep + ' ' + x + ' ' + y; }
    function box(x, y, w, h, rad) {
      return 'M' + (x + rad) + ' ' + y + 'H' + (x + w - rad) + arc(rad, 1, x + w, y + rad) +
        'V' + (y + h - rad) + arc(rad, 1, x + w - rad, y + h) + 'H' + (x + rad) + arc(rad, 1, x, y + h - rad) +
        'V' + (y + rad) + arc(rad, 1, x + rad, y) + 'Z';
    }
    var d = '';
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        if (eye(r, c)) continue;
        var up = dark(r - 1, c), down = dark(r + 1, c), left = dark(r, c - 1), right = dark(r, c + 1);
        if (dark(r, c)) {
          var tl = !up && !left ? k : 0, tr = !up && !right ? k : 0, br = !down && !right ? k : 0, bl = !down && !left ? k : 0;
          d += 'M' + (c + tl) + ' ' + r + 'H' + (c + 1 - tr) + (tr ? arc(k, 1, c + 1, r + k) : '') +
            'V' + (r + 1 - br) + (br ? arc(k, 1, c + 1 - k, r + 1) : '') +
            'H' + (c + bl) + (bl ? arc(k, 1, c, r + 1 - k) : '') +
            'V' + (r + tl) + (tl ? arc(k, 1, c + k, r) : '') + 'Z';
        } else {
          // A light module in an inside corner: fill the corner so the turn is smooth.
          if (up && left && dark(r - 1, c - 1)) d += 'M' + c + ' ' + r + 'H' + (c + k) + arc(k, 0, c, r + k) + 'Z';
          if (up && right && dark(r - 1, c + 1)) d += 'M' + (c + 1) + ' ' + r + 'V' + (r + k) + arc(k, 0, c + 1 - k, r) + 'Z';
          if (down && right && dark(r + 1, c + 1)) d += 'M' + (c + 1) + ' ' + (r + 1) + 'H' + (c + 1 - k) + arc(k, 0, c + 1, r + 1 - k) + 'Z';
          if (down && left && dark(r + 1, c - 1)) d += 'M' + c + ' ' + (r + 1) + 'V' + (r + 1 - k) + arc(k, 0, c + k, r + 1) + 'Z';
        }
      }
    }
    var eyes = '';
    [[0, 0], [0, n - 7], [n - 7, 0]].forEach(function (at) {
      var y = at[0], x = at[1];
      // Outer ring (with its hole) and the centre, filled even-odd.
      eyes += box(x, y, 7, 7, 2.6) + box(x + 1, y + 1, 5, 5, 1.7) + box(x + 2, y + 2, 3, 3, 1.1);
    });
    var svg = document.createElementNS(NS, 'svg');
    // Two modules of white all round (the quiet zone), part of the drawing so it scales with it.
    svg.setAttribute('viewBox', '-2 -2 ' + (n + 4) + ' ' + (n + 4));
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', label);
    var bg = document.createElementNS(NS, 'rect');
    bg.setAttribute('x', -2);
    bg.setAttribute('y', -2);
    bg.setAttribute('width', n + 4);
    bg.setAttribute('height', n + 4);
    bg.setAttribute('fill', '#fff');
    svg.appendChild(bg);
    [[d, 'nonzero'], [eyes, 'evenodd']].forEach(function (part) {
      var path = document.createElementNS(NS, 'path');
      path.setAttribute('d', part[0]);
      path.setAttribute('fill', '#000');
      path.setAttribute('fill-rule', part[1]);
      svg.appendChild(path);
    });
    return svg;
  }
  // qr-art:end

  function qrSvg(url) {
    var scratch = document.createElement('div');
    var q = new QRCode(scratch, { text: url, width: 64, height: 64, correctLevel: QRCode.CorrectLevel.M });
    return qrArt(q._oQRCode, 'QR code');
  }

  var printable = BOOT.sessions.filter(function (s) { return s.url; });
  var roomOnly = BOOT.sessions.filter(function (s) { return !s.url; });
  document.title = BOOT.eventName + ' — QR sheets';
  document.getElementById('intro').textContent = printable.length
    ? printable.length + (printable.length === 1 ? ' page' : ' pages') + ' for ' + BOOT.eventName + ', one per shareable-link session. Print on letter or A4.'
    : 'No sessions in ' + BOOT.eventName + ' use a shareable link, so there is nothing to print.';
  document.getElementById('print').hidden = !printable.length;

  printable.forEach(function (s) {
    var page = el('section', 'page');
    if (brand.logo) { var img = el('img', 'logo'); img.src = brand.logo; img.alt = brand.orgName || ''; page.appendChild(img); }
    else if (brand.orgName) page.appendChild(el('p', 'org', brand.orgName));
    page.appendChild(el('p', 'event', BOOT.eventName));
    page.appendChild(el('h1', null, s.name));
    if (s.heading) page.appendChild(el('p', 'heading', s.heading));
    var qr = el('div', 'qr');
    qr.appendChild(qrSvg(s.url));
    qr.firstChild.setAttribute('aria-label', 'QR code for ' + s.name);
    page.appendChild(qr);
    var scan = el('p', 'scan', SCAN.en[0]);
    langs.forEach(function (code) {
      if (code === 'en') return;
      var line = el('span', null, SCAN[code][0]);
      line.lang = code;
      scan.appendChild(line);
    });
    page.appendChild(scan);
    page.appendChild(el('p', 'anon', SCAN.en[1]));
    page.appendChild(el('p', 'link', s.url));
    document.getElementById('pages').appendChild(page);
  });

  if (roomOnly.length) {
    var skipped = document.getElementById('skipped');
    skipped.textContent = 'Not printed (in-room sessions join by the changing code on the room screen): ' +
      roomOnly.map(function (s) { return s.name; }).join(', ') + '.';
    skipped.hidden = false;
  }

  document.getElementById('print').onclick = function () { window.print(); };
</script>
</body>
</html>
