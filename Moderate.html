<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  [hidden] { display: none !important; }
  :root {
    --ink: #16202b;
    --muted: #5c6874;
    --rule: #d9dee3;
    --action: #1b5e5a;
    --stop: #8c2f22;
    --paper: #f7f8f9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: #fff;
    font-size: 16px;
    line-height: 1.45;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  h1 { font-size: 1.2rem; margin: 0; font-weight: 600; }
  .title { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .title img { max-height: 32px; max-width: 140px; }
  .title select { font: inherit; padding: 5px 8px; border: 1px solid var(--rule); border-radius: 4px; background: #fff; max-width: 60vw; }
  .pill { font-size: 0.75rem; border-radius: 10px; padding: 2px 8px; background: var(--paper); color: var(--muted); border: 1px solid var(--rule); }
  .pill.active { background: #e5f2ef; color: var(--action); border-color: #b9dcd5; }
  .nav { display: flex; gap: 14px; font-size: 0.9rem; }
  .nav a { color: var(--action); }
  .notice { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 14px; margin-bottom: 18px; color: var(--muted); }
  .tally { color: var(--muted); font-size: 0.9rem; }

  button {
    font: inherit;
    padding: 7px 12px;
    border: 1px solid var(--rule);
    background: #fff;
    border-radius: 4px;
    cursor: pointer;
    color: var(--ink);
  }
  button:hover { background: var(--paper); }
  button:focus-visible { outline: 2px solid var(--action); outline-offset: 1px; }
  button.primary { background: var(--action); border-color: var(--action); color: #fff; }
  button.quiet { border-color: transparent; color: var(--muted); }

  .topic { border: 1px solid var(--rule); border-radius: 6px; margin-bottom: 18px; overflow: hidden; }
  .topic.live { border: 2px solid var(--action); }
  .topic.live > .head { background: var(--action); color: var(--action-ink, #fff); }
  .topic.live > .head .count { color: inherit; opacity: 0.85; }
  .votes { font-weight: 600; color: var(--action); }
  .topic.live .votes { color: inherit; }
  header { border-top: 4px solid var(--action); padding-top: 12px; }
  .onphones { font-size: 0.75rem; border-radius: 10px; padding: 2px 8px; margin-left: 6px; background: #e5f2ef; color: var(--action); border: 1px solid #b9dcd5; font-weight: 400; vertical-align: 2px; }
  .topic.live .onphones { background: rgba(255,255,255,0.2); color: inherit; border-color: transparent; }
  .modal { position: fixed; inset: 0; background: rgba(22,32,43,0.45); display: flex; align-items: flex-start; justify-content: center; padding: 10vh 16px; z-index: 10; }
  .modal form { background: #fff; border-radius: 6px; padding: 18px; width: 100%; max-width: 28rem; box-shadow: 0 8px 32px rgba(0,0,0,0.25); }
  .modal h2 { font-size: 1.05rem; margin: 0 0 8px; }
  .modal p { margin: 0 0 16px; color: var(--muted); }
  .modal .row { display: flex; gap: 8px; }
  .prepared { border: 1px dashed var(--rule); border-radius: 6px; margin-bottom: 18px; }
  .prepared summary { padding: 11px 14px; cursor: pointer; font-weight: 600; background: var(--paper); border-radius: 6px; }
  .prepared summary span { color: var(--muted); font-weight: 400; }
  .prepared li .text { color: var(--ink); }
  .dismissed-box { margin-top: 28px; }
  .dismissed-box li .text { color: var(--muted); }
  .topic.done:not(.live) { opacity: 0.72; }
  .topic.done:not(.live) > .head { background: #fff; }
  button.danger-solid { background: var(--stop); border-color: var(--stop); color: #fff; }
  .topic > .head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 14px; background: var(--paper); border-bottom: 1px solid var(--rule);
    flex-wrap: wrap;
  }
  .topic h2 { font-size: 1rem; margin: 0; font-weight: 600; }
  .count { color: var(--muted); font-weight: 400; font-size: 0.9rem; }

  .merged { padding: 12px 14px; border-bottom: 1px solid var(--rule); background: #fffdf5; }
  .merged span { display: block; color: var(--muted); font-size: 0.8rem; margin-bottom: 4px; }
  .merged .also, .also-labels { display: block; color: var(--muted); font-size: 0.82rem; margin: 6px 0 0; }
  .also-labels { padding: 8px 14px; margin: 0; border-bottom: 1px solid var(--rule); }
  .also-labels span, .merged .also span { display: inline; font-size: inherit; margin: 0; }
  .topic.live .also-labels { color: inherit; opacity: 0.85; }
  .also-labels b, .merged .also b { font-weight: 600; }

  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 12px; align-items: flex-start; padding: 11px 14px; border-bottom: 1px solid #eef1f3; }
  li:last-child { border-bottom: 0; }
  /* Answered: muted text with a tag. No strike-through — it used to hit the buttons too. */
  li.answered .text { color: var(--muted); }
  .done-tag { display: inline-block; font-size: 0.72rem; font-weight: 600; color: var(--action); background: #e5f2ef; border-radius: 3px; padding: 1px 6px; margin-right: 6px; vertical-align: 1px; }
  li .text { flex: 1; }
  li .acts { display: flex; gap: 6px; flex-shrink: 0; }

  .chip {
    display: inline-block;
    font-size: 0.72rem;
    color: var(--muted);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 1px 6px;
    margin-right: 6px;
    vertical-align: 1px;
  }
  .original {
    display: block;
    margin-top: 5px;
    padding-left: 10px;
    border-left: 2px solid var(--rule);
    color: var(--muted);
    font-size: 0.92rem;
  }
  .pending { color: var(--muted); font-style: italic; }

  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
  button.small { padding: 4px 10px; font-size: 0.88rem; }
  li:hover { background: #fbfcfc; }

  /* Accepting / paused switch */
  button.switch { display: inline-flex; align-items: center; gap: 8px; }
  button.switch .dot { width: 10px; height: 10px; border-radius: 50%; background: #2e9d6a; box-shadow: 0 0 0 3px #d9f1e5; }
  button.switch[aria-pressed="false"] { border-color: #e2c9a3; background: #fff8ec; }
  button.switch[aria-pressed="false"] .dot { background: #c77b12; box-shadow: 0 0 0 3px #fbe8c8; }
  label.check { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.95rem; cursor: pointer; }
  .updated { margin-left: auto; color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .updated.stale { color: #b5561b; font-weight: 600; }

  /* Topic actions: most-used first; destructive ones in the ⋯ menu */
  .topic > .head .acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button.toggle[aria-pressed="true"] { background: #e5f2ef; border-color: #b9dcd5; color: var(--action); }
  .topic.live button.toggle[aria-pressed="true"] { background: rgba(255,255,255,0.22); border-color: transparent; color: inherit; }
  .live-tag { display: inline-block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; background: rgba(255,255,255,0.22); border-radius: 3px; padding: 2px 7px; margin-left: 8px; vertical-align: 2px; }
  details.more { position: relative; }
  details.more > summary { list-style: none; cursor: pointer; padding: 6px 10px; border-radius: 4px; color: inherit; opacity: 0.8; font-weight: 700; }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary:hover { background: rgba(0,0,0,0.06); }
  details.more .menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 5; min-width: 13rem; background: #fff; color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,0.12); padding: 4px; }
  details.more .menu button { display: block; width: 100%; text-align: left; border: 0; }
  details.more .menu button.danger { color: var(--stop); }

  @media (max-width: 700px) {
    body { padding: 12px; }
    li { flex-direction: column; gap: 6px; }
    li .acts { align-self: flex-end; }
    .topic > .head .acts { width: 100%; }
    .updated { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="title">
    <img id="logo" alt="" hidden>
    <h1 id="name">Question queue</h1>
    <select id="switcher" aria-label="Switch session" hidden></select>
    <span class="pill" id="pill"></span>
  </div>
  <div class="nav">
    <span class="tally" id="tally">Loading…</span>
    <a id="roomLink" target="_blank" rel="noopener">Room screen</a>
    <a id="adminLink" target="_top" hidden>Admin</a>
  </div>
</header>

<div class="notice" id="endedNotice" hidden>This session has ended. The queue is read-only.</div>

<div class="bar">
  <button type="button" id="toggle" class="switch" aria-pressed="true" title="Click to pause or resume new questions">
    <span class="dot" aria-hidden="true"></span><span id="toggleText">Accepting questions</span>
  </button>
  <button type="button" id="cluster">Group now</button>
  <label class="check"><input type="checkbox" id="originals"> Show original wording</label>
  <span class="updated" id="updated" aria-live="polite"></span>
</div>

<details class="prepared" id="prepared" hidden>
  <summary>Prepared questions <span id="preparedCount"></span></summary>
  <ul id="preparedList"></ul>
</details>

<div id="board"><p class="empty">Waiting for the first question.</p></div>

<details class="prepared dismissed-box" id="dismissed" hidden>
  <summary>Dismissed <span id="dismissedCount"></span></summary>
  <ul id="dismissedList"></ul>
</details>

<div class="modal" id="dialog" hidden>
  <form id="dialogForm" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <h2 id="dialogTitle"></h2>
    <p id="dialogBody"></p>
    <div class="row">
      <button type="submit" class="danger-solid" id="dialogOk">OK</button>
      <button type="button" class="quiet" id="dialogCancel">Cancel</button>
    </div>
  </form>
</div>

<script>
  var BOOT = <?!= boot ?>;
  var sid = BOOT.sid;
  var board = document.getElementById('board');
  var tally = document.getElementById('tally');
  var toggle = document.getElementById('toggle');
  var state = null;
  var showOriginals = false;

  document.getElementById('originals').onchange = function () {
    showOriginals = this.checked;
    if (state) draw(state, true);
  };

  if (BOOT.brand.accent) {
    document.documentElement.style.setProperty('--action', BOOT.brand.accent);
    var hx = BOOT.brand.accent.replace('#', '');
    var lum = (parseInt(hx.substr(0, 2), 16) * 299 + parseInt(hx.substr(2, 2), 16) * 587 + parseInt(hx.substr(4, 2), 16) * 114) / 1000;
    if (lum > 150) document.documentElement.style.setProperty('--action-ink', '#16202b');
  }
  if (BOOT.brand.logo) {
    var logo = document.getElementById('logo');
    logo.src = BOOT.brand.logo;
    logo.alt = BOOT.brand.orgName;
    logo.hidden = false;
  }

  var switcher = document.getElementById('switcher');
  switcher.onchange = function () {
    if (!state) return;
    window.top.location.href = state.adminUrl.replace('view=admin', 'view=moderate&s=' + switcher.value);
  };
  google.script.run.withSuccessHandler(function (sessions) {
    if (sessions.length < 2) return;
    sessions.forEach(function (s) {
      var o = document.createElement('option');
      o.value = s.id;
      o.textContent = s.name + (s.status === 'active' ? '' : ' (' + (s.status === 'ended' ? 'ended' : 'not active') + ')');
      if (s.id === sid) o.selected = true;
      switcher.appendChild(o);
    });
    switcher.hidden = false;
    document.getElementById('name').hidden = true;
  }).mySessions();

  var ended = false;

  // In-page confirmation instead of confirm(), which shows the sandbox's googleusercontent.com address.
  var dialogDone = null;
  function ask(title, body, okLabel, onOk) {
    document.getElementById('dialogTitle').textContent = title;
    document.getElementById('dialogBody').textContent = body;
    document.getElementById('dialogOk').textContent = okLabel;
    dialogDone = onOk;
    document.getElementById('dialog').hidden = false;
    document.getElementById('dialogOk').focus();
  }
  function closeDialog() { document.getElementById('dialog').hidden = true; dialogDone = null; }
  document.getElementById('dialogCancel').onclick = closeDialog;
  document.getElementById('dialog').addEventListener('click', function (e) { if (e.target === this) closeDialog(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDialog(); });
  document.getElementById('dialogForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var done = dialogDone;
    closeDialog();
    if (done) done();
  });

  // ------------------------------------------------------------ instant updates
  //
  // Every click changes the page immediately, then saves in the background. Apps Script
  // takes a second or more to answer, so waiting for it made buttons feel broken. While
  // a save is in flight, background refreshes don't overwrite what the facilitator just did.

  var pending = 0;
  var saves = 0;        // bumps on every save, so a refresh that read the sheet before it is ignored
  var topicMeta = {};   // votes and phone approval per topic, to restore topics that emptied
  var merging = {};     // topic -> 'busy' or 'failed', kept across redraws
  var lastRaw = null;   // the last board drawn from the server, to skip identical refreshes
  var saveError = null; // { text, until }

  function showError(text) {
    saveError = { text: text, until: Date.now() + 10000 };
    showUpdated();
  }

  function send(fn, args) {
    pending++;
    saves++;
    var runner = google.script.run
      .withSuccessHandler(function (fresh) {
        pending--;
        if (!pending && fresh && fresh.session) draw(fresh);
      })
      .withFailureHandler(function (err) {
        pending--;
        showError('That change didn\'t save' + (err && err.message ? ' (' + err.message + ')' : '') + ' — reloaded the queue');
        load(true);
      });
    runner[fn].apply(runner, args);
  }

  function byAnswered(a, b) {
    return ((a.status === 'answered') - (b.status === 'answered')) || (a.submitted - b.submitted);
  }

  /** Same ordering as the server: open first, answered below, fully answered topics last. */
  function normalize(data) {
    data.dismissed = data.dismissed || [];
    data.unsorted.sort(byAnswered);
    data.topics.forEach(function (t) {
      t.questions.sort(byAnswered);
      t.count = t.questions.length;
      t.answered = t.count > 0 && t.questions.every(function (q) { return q.status === 'answered'; });
      topicMeta[t.topic] = { votes: t.votes, shown: t.shown };
    });
    data.topics = data.topics.filter(function (t) { return t.count > 0; });
    data.topics.sort(function (a, b) {
      return ((b.topic === data.nowAnswering) - (a.topic === data.nowAnswering)) ||   // being answered: top
        (a.answered - b.answered) || ((b.count + b.votes) - (a.count + a.votes));
    });
    data.dismissed.sort(function (a, b) { return b.submitted - a.submitted; });
  }

  function findTopic(name) {
    for (var i = 0; i < state.topics.length; i++) if (state.topics[i].topic === name) return state.topics[i];
    return null;
  }

  function takeQuestion(id) {
    var lists = [state.unsorted, state.dismissed];
    state.topics.forEach(function (t) { lists.push(t.questions); });
    for (var i = 0; i < lists.length; i++) {
      for (var j = 0; j < lists[i].length; j++) {
        if (lists[i][j].id === id) return lists[i].splice(j, 1)[0];
      }
    }
    return null;
  }

  function placeQuestion(q) {
    if (q.status === 'dismissed') { state.dismissed.push(q); return; }
    if (!q.topic) { state.unsorted.push(q); return; }
    var t = findTopic(q.topic);
    if (!t) {
      var meta = topicMeta[q.topic] || { votes: 0, shown: false };
      t = { topic: q.topic, questions: [], count: 0, votes: meta.votes, shown: meta.shown };
      state.topics.push(t);
    }
    t.questions.push(q);
  }

  function act(ids, status) {
    ids.forEach(function (id) {
      var q = takeQuestion(id);
      if (!q) return;
      q.status = status;
      placeQuestion(q);
    });
    normalize(state);
    draw(state, true);
    send('setStatus', [sid, ids, status]);
  }

  function draw(data, local) {
    if (!local) normalize(data);
    if (local) lastRaw = null;   // the next refresh redraws even if it matches the old one
    state = data;
    ended = data.session.status === 'ended';
    document.getElementById('name').textContent = data.session.name;
    document.title = data.session.name + ' — queue';
    var pill = document.getElementById('pill');
    pill.textContent = data.session.status === 'active' ? 'Active' : ended ? 'Ended' : 'Not active';
    pill.className = 'pill ' + data.session.status;
    document.getElementById('roomLink').href = data.session.links.present;
    var adminLink = document.getElementById('adminLink');
    adminLink.href = data.adminUrl;
    adminLink.hidden = !data.isAdmin;
    document.getElementById('endedNotice').hidden = !ended;
    document.querySelector('.bar').hidden = ended;

    document.getElementById('toggleText').textContent = data.open ? 'Accepting questions' : 'Paused — not accepting questions';
    toggle.setAttribute('aria-pressed', data.open ? 'true' : 'false');
    drawPrepared(data.prepared || []);
    drawDismissed(data.dismissed);

    var total = data.unsorted.length;
    data.topics.forEach(function (t) { total += t.count; });
    tally.textContent = total + (total === 1 ? ' question' : ' questions') +
      ' across ' + data.topics.length + (data.topics.length === 1 ? ' topic' : ' topics');

    if (!total) {
      board.innerHTML = '<p class="empty">Waiting for the first question.</p>';
      return;
    }

    // Rebuilding the board would close an open ⋯ menu and drop keyboard focus: put them back.
    var openMenu = board.querySelector('details.more[open]');
    openMenu = openMenu && openMenu.getAttribute('data-topic');
    var active = document.activeElement;
    var focusTopic = active && board.contains(active) && active.closest('.topic') ? active.closest('.topic').getAttribute('data-topic') : null;
    var focusKey = focusTopic !== null ? (active.getAttribute('data-key') || active.textContent) : null;

    board.innerHTML = '';
    data.topics.forEach(function (t) { board.appendChild(topicBlock(t, data.merged[t.topic], false, data.nowAnswering === t.topic, (data.mergedTranslations || {})[t.topic])); });
    if (data.unsorted.length) {
      board.appendChild(topicBlock({ topic: 'Not yet grouped', questions: data.unsorted, count: data.unsorted.length }, null, true));
    }

    var blocks = board.querySelectorAll('.topic');
    for (var i = 0; i < blocks.length; i++) {
      var name = blocks[i].getAttribute('data-topic');
      if (openMenu !== null && name === openMenu) {
        var menu = blocks[i].querySelector('details.more');
        if (menu) menu.open = true;
      }
      if (focusTopic !== null && name === focusTopic) {
        var candidates = blocks[i].querySelectorAll('button, summary');
        for (var j = 0; j < candidates.length; j++) {
          if ((candidates[j].getAttribute('data-key') || candidates[j].textContent) === focusKey) { candidates[j].focus(); break; }
        }
      }
    }
  }

  function drawPrepared(list) {
    var box = document.getElementById('prepared');
    box.hidden = ended || !list.length;
    document.getElementById('preparedCount').textContent = '· ' + list.length + ' ready to add';
    var ul = document.getElementById('preparedList');
    ul.innerHTML = '';
    list.forEach(function (q) {
      var li = el('li');
      var text = el('div', 'text');
      text.textContent = q.text;
      li.appendChild(text);
      var acts = el('div', 'acts');
      var add = el('button', 'primary');
      add.textContent = 'Add to queue';
      add.onclick = function () {
        state.prepared = state.prepared.filter(function (p) { return p.id !== q.id; });
        state.unsorted.push({ id: q.id, text: q.text, lang: '', translation: '', topic: '', status: 'new', submitted: Date.now() });
        normalize(state);
        draw(state, true);
        send('usePrepared', [sid, [q.id]]);
      };
      acts.appendChild(add);
      li.appendChild(acts);
      ul.appendChild(li);
    });
  }

  function drawDismissed(list) {
    var box = document.getElementById('dismissed');
    box.hidden = !list.length;
    document.getElementById('dismissedCount').textContent = '· ' + list.length;
    var ul = document.getElementById('dismissedList');
    ul.innerHTML = '';
    list.forEach(function (q) {
      var li = el('li');
      var text = el('div', 'text');
      var translated = q.translation && q.translation !== q.text;
      text.textContent = translated ? q.translation : q.text;
      if (q.topic) {
        var where = el('span', 'original');
        where.textContent = q.topic;
        text.appendChild(where);
      }
      li.appendChild(text);
      if (!ended) {
        var acts = el('div', 'acts');
        var restore = el('button');
        restore.textContent = 'Restore';
        restore.onclick = function () { act([q.id], 'new'); };
        acts.appendChild(restore);
        li.appendChild(acts);
      }
      ul.appendChild(li);
    });
  }

  /** "Phones show it as Korean: … · Spanish: …" — facilitators approve these along with the label. */
  function alsoShown(intro, list, className) {
    var box = el('div', className);
    var lead = el('span');
    lead.textContent = intro;
    box.appendChild(lead);
    list.forEach(function (tr, i) {
      box.appendChild(document.createTextNode(i ? ' · ' : ' '));
      var b = el('b');
      b.textContent = tr.language + ':';
      box.appendChild(b);
      box.appendChild(document.createTextNode(' ' + tr.text));
    });
    return box;
  }

  function topicBlock(t, mergedText, isLoose, isLive, mergedTranslations) {
    var wrap = el('div', 'topic' + (isLive ? ' live' : '') + (t.answered ? ' done' : ''));
    wrap.setAttribute('data-topic', isLoose ? '' : t.topic);

    var head = el('div', 'head');
    var h = el('h2');
    h.textContent = t.topic;
    var c = el('span', 'count');
    c.textContent = t.count + (t.count === 1 ? ' question' : ' questions') + (t.answered ? ' · all answered' : '');
    h.appendChild(document.createTextNode(' '));
    h.appendChild(c);
    if (t.votes) {
      var v = el('span', 'votes');
      v.textContent = ' · +' + t.votes + ' me too';
      h.appendChild(v);
    }
    if (isLive) {
      var tag = el('span', 'live-tag');
      tag.textContent = 'Answering now';
      h.appendChild(tag);
    }
    head.appendChild(h);

    if (!isLoose && !ended) {
      var acts = el('div', 'acts');
      var live = el('button', isLive || t.answered ? '' : 'primary');   // done topics: no loud button
      live.type = 'button';
      live.textContent = isLive ? 'Stop answering' : 'Answer now';
      live.title = isLive
        ? 'Take this topic off the room screen and participants\' phones'
        : 'Put this topic on the room screen and participants\' phones as the one being answered';
      live.onclick = function () {
        state.nowAnswering = isLive ? null : t.topic;
        normalize(state);
        draw(state, true);
        send('setNowAnswering', [sid, isLive ? null : t.topic]);
      };
      acts.appendChild(live);

      var phones = el('button', 'toggle');
      phones.type = 'button';
      phones.setAttribute('aria-pressed', t.shown ? 'true' : 'false');
      phones.textContent = t.shown ? 'On phones ✓' : 'Show on phones';
      phones.title = t.shown
        ? 'Participants can see this topic and tap Me too. Click to hide it from phones.'
        : 'Let participants see this topic label and tap Me too';
      phones.onclick = function () {
        t.shown = !t.shown;
        topicMeta[t.topic] = { votes: t.votes, shown: t.shown };
        draw(state, true);
        send('setTopicShown', [sid, t.topic, t.shown]);
      };
      acts.appendChild(phones);

      var merge = el('button');
      merge.type = 'button';
      merge.setAttribute('data-key', 'merge');
      merge.textContent = merging[t.topic] === 'busy' ? 'Merging…'
        : merging[t.topic] === 'failed' ? 'Merge failed — retry'
        : mergedText ? 'Rewrite merged question' : 'Merge into one question';
      merge.disabled = merging[t.topic] === 'busy';   // survives the 5-second refresh, so no double Gemini call
      merge.onclick = function () {
        merging[t.topic] = 'busy';
        merge.disabled = true;
        merge.textContent = 'Merging…';   // Gemini writes this, so it takes a few seconds
        google.script.run.withSuccessHandler(function (res) {
          if (res.ok) { delete merging[t.topic]; state.merged[t.topic] = res.question; draw(state, true); }
          else { merging[t.topic] = 'failed'; draw(state, true); }
        }).withFailureHandler(function () {
          merging[t.topic] = 'failed'; draw(state, true);
        }).mergeTopic(sid, t.topic);
      };
      acts.appendChild(merge);

      var more = el('details', 'more');
      more.setAttribute('data-topic', t.topic);
      var summary = el('summary');
      summary.textContent = '⋯';
      summary.setAttribute('aria-label', 'More actions for ' + t.topic);
      more.appendChild(summary);
      var menu = el('div', 'menu');
      var dismissAll = el('button', 'danger');
      dismissAll.type = 'button';
      dismissAll.textContent = 'Dismiss all ' + t.count + (t.count === 1 ? ' question' : ' questions');
      dismissAll.onclick = function () {
        more.open = false;
        ask('Dismiss this topic?', 'All ' + t.count + (t.count === 1 ? ' question' : ' questions') + ' under "' + t.topic +
          '" move to Dismissed at the bottom of the page and come off participants\' phones. You can restore them.', 'Dismiss all', function () {
          act(t.questions.map(function (q) { return q.id; }), 'dismissed');
        });
      };
      menu.appendChild(dismissAll);
      more.appendChild(menu);
      acts.appendChild(more);
      head.appendChild(acts);
    }
    wrap.appendChild(head);

    if (!isLoose && t.translations && t.translations.length) {
      wrap.appendChild(alsoShown(t.shown ? 'Phones show it as' : 'If shown, phones show it as', t.translations, 'also-labels'));
    }

    if (mergedText) {
      var m = el('div', 'merged');
      var label = el('span');
      label.textContent = 'Read this out';
      m.appendChild(label);
      m.appendChild(document.createTextNode(mergedText));
      if (mergedTranslations && mergedTranslations.length) {
        m.appendChild(alsoShown('While answering, phones and the room screen also show', mergedTranslations, 'also'));
      }
      wrap.appendChild(m);
    }

    var list = el('ul');
    t.questions.forEach(function (q) {
      var li = el('li', q.status === 'answered' ? 'answered' : '');
      var text = el('div', 'text');

      var translated = q.translation && q.translation !== q.text;

      if (q.status === 'answered') {
        var done = el('span', 'done-tag');
        done.textContent = '✓ Answered';
        text.appendChild(done);
      }
      if (q.lang && translated) {
        var chip = el('span', 'chip');
        chip.textContent = q.lang;
        text.appendChild(chip);
      }
      text.appendChild(document.createTextNode(translated ? q.translation : q.text));

      if (translated && showOriginals) {
        var orig = el('span', 'original');
        orig.textContent = q.text;
        text.appendChild(orig);
      }
      if (!q.lang && !q.translation) {
        // Language is only known after grouping, which runs every minute — so English
        // questions wait here too. They are not being translated.
        var wait = el('span', 'original pending');
        wait.textContent = Date.now() - q.submitted < 150000
          ? 'Waiting to be grouped (every minute)'
          : 'Not grouped yet — press Group now, or run the health check on the Admin page';
        text.appendChild(wait);
      }
      li.appendChild(text);
      list.appendChild(li);
      if (ended) return;

      var acts2 = el('div', 'acts');
      var mark = el('button', 'small');
      mark.type = 'button';
      mark.textContent = q.status === 'answered' ? 'Reopen' : 'Answered';
      mark.title = q.status === 'answered' ? 'Mark as not answered yet' : 'Mark this question as answered';
      mark.onclick = function () { act([q.id], q.status === 'answered' ? 'new' : 'answered'); };
      var drop = el('button', 'small quiet');
      drop.type = 'button';
      drop.textContent = 'Dismiss';
      drop.title = 'Move to Dismissed at the bottom of the page';
      drop.onclick = function () { act([q.id], 'dismissed'); };
      acts2.appendChild(mark);
      acts2.appendChild(drop);
      li.appendChild(acts2);
    });
    wrap.appendChild(list);
    return wrap;
  }

  function el(tag, cls) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    return n;
  }

  toggle.onclick = function () {
    if (!state) return;   // not loaded yet
    state.open = !state.open;
    draw(state, true);
    send('setBoardOpen', [sid, state.open]);
  };

  document.getElementById('cluster').onclick = function () {
    var b = this;
    b.disabled = true;
    b.textContent = 'Grouping…';
    google.script.run.withSuccessHandler(function () {
      b.disabled = false;
      b.textContent = 'Group now';
      load(true);
    }).withFailureHandler(function () {
      b.disabled = false;
      b.textContent = 'Grouping failed — retry';
    }).groupNow(sid);
  };


  function load(force) {
    if (ended && !force) return;
    var savesAtStart = saves;
    google.script.run.withSuccessHandler(function (fresh) {
      lastLoaded = Date.now();
      showUpdated();
      if (pending && !force) return;   // a save is in flight; its answer will redraw
      if (savesAtStart !== saves) return;   // read before a save landed; it would undo the click on screen
      var raw = JSON.stringify(fresh);
      if (raw === lastRaw && !force) return;   // nothing changed: leave menus, focus and scroll alone
      lastRaw = raw;
      draw(fresh);
    }).withFailureHandler(function (err) {
      tally.textContent = err && err.message ? err.message : 'Lost connection — retrying';
    }).getBoard(sid);
  }

  // Shows the queue is live; warns if refreshes stop arriving.
  var lastLoaded = 0;
  function showUpdated() {
    var el2 = document.getElementById('updated');
    if (saveError && Date.now() < saveError.until) {
      el2.className = 'updated stale';
      el2.textContent = saveError.text;
      return;
    }
    if (!lastLoaded) { el2.textContent = 'Loading…'; return; }
    var stale = !ended && Date.now() - lastLoaded > 20000;
    el2.className = stale ? 'updated stale' : 'updated';
    el2.textContent = stale
      ? 'Not updating — check the connection'
      : 'Updated ' + new Date(lastLoaded).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  }
  setInterval(showUpdated, 1000);

  load(true);
  setInterval(load, 5000);
</script>
</body>
</html>
