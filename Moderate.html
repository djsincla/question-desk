<!DOCTYPE html>
<html>
<head>
<base target="_top">
<?!= styles ?>
</head>
<body>

<header>
  <div class="title">
    <img id="logo" alt="" hidden>
    <h1 id="name" data-w="mod.title">Question queue</h1>
    <select id="switcher" data-w-a="mod.switchSession" aria-label="Switch session" hidden></select>
    <span class="room" id="room" hidden></span>
    <span class="pill" id="pill"></span>
  </div>
  <div class="nav">
    <span class="tally" id="tally" data-w="mod.loading">Loading…</span>
    <a id="roomLink" target="_blank" rel="noopener" data-w="mod.roomScreen">Room screen</a>
    <a id="panelLink" target="_blank" rel="noopener" data-w="mod.panelLink" data-w-t="mod.panelLinkTitle" title="The question being answered, large, for the panel table">Panelist view</a>
    <button type="button" class="quiet small" id="keysHelp" data-w="mod.shortcuts" data-w-t="mod.shortcutsTitle" title="Keyboard shortcuts (press ?)">Shortcuts</button>
    <a id="adminLink" target="_top" data-w="mod.admin" hidden>Admin</a>
  </div>
</header>

<div class="notice" id="endedNotice" data-w="mod.endedNotice" hidden>This session has ended. The queue is read-only.</div>
<div class="notice warn" id="groupingNotice" hidden role="status"></div>
<div class="selection" id="selection" hidden role="region" data-w-a="mod.selectedRegion" aria-label="Selected questions">
  <strong id="selCount"></strong>
  <button type="button" class="primary small" id="selGroup" data-w="mod.selGroup">Group as…</button>
  <button type="button" class="small" id="selUngroup" data-w="mod.selUngroup">Ungroup</button>
  <button type="button" class="small" id="selAnswered" data-w="mod.selAnswered">Answered</button>
  <button type="button" class="small quiet" id="selDismiss" data-w="mod.selDismiss">Dismiss</button>
  <button type="button" class="small quiet" id="selClear" data-w="mod.selClear">Clear</button>
</div>

<div class="bar">
  <button type="button" id="toggle" class="switch" aria-pressed="true" data-w-t="mod.toggleTitle" title="Click to pause or resume new questions">
    <span class="dot" aria-hidden="true"></span><span id="toggleText" data-w="mod.accepting">Accepting questions</span>
  </button>
  <button type="button" id="cluster" data-w="mod.groupNow" data-w-t="mod.groupNowTitle" title="Group and translate waiting questions now, even when automatic grouping is off">Group now</button>
  <label class="check" data-w-t="mod.autoGroupTitle" title="Every minute, Gemini groups new questions into topics. Off: questions are still translated, and you group them yourself."><input type="checkbox" id="autoGroup"> <span data-w="mod.autoGroup">Group automatically</span></label>
  <label class="check" data-w-t="mod.autoShowTitle" title="Answer now also shows the topic on participants' phones"><input type="checkbox" id="autoShow"> <span data-w="mod.autoShow">Show on phones when answering</span></label>
  <label class="check" data-w-t="mod.roomQuestionsTitle" title="The room screen lists what's on participants' phones, most Me too first"><input type="checkbox" id="roomQuestions"> <span data-w="mod.roomQuestions">List on the room screen</span></label>
  <label class="check"><input type="checkbox" id="originals"> <span data-w="mod.originals">Show original wording</span></label>
  <span class="updated" id="updated" aria-live="polite"></span>
</div>

<details class="prepared" id="prepared" hidden>
  <summary><span data-w="mod.prepared">Prepared questions</span> <span id="preparedCount"></span></summary>
  <ul id="preparedList"></ul>
</details>

<div id="board"><p class="empty" data-w="mod.empty">Waiting for the first question.</p></div>

<details class="prepared dismissed-box" id="dismissed" hidden>
  <summary><span data-w="mod.dismissedBox">Dismissed</span> <span id="dismissedCount"></span></summary>
  <ul id="dismissedList"></ul>
</details>

<div class="modal" id="groupDialog" hidden>
  <form id="groupForm" role="dialog" aria-modal="true" aria-labelledby="groupTitle">
    <h2 id="groupTitle" data-w="mod.groupDialogTitle">Group questions</h2>
    <p id="groupHint" data-w="mod.groupHint">Type a new topic, or pick one that exists to add these questions to it.</p>
    <input class="full-width space-below-14" type="text" id="groupName" list="topicNames" maxlength="80" autocomplete="off" data-w-a="mod.topicName" aria-label="Topic name">
    <datalist id="topicNames"></datalist>
    <div class="row">
      <button type="submit" class="primary" id="groupOk" data-w="mod.groupOk">Group</button>
      <button type="button" class="quiet" id="groupCancel" data-w="mod.cancel">Cancel</button>
    </div>
  </form>
</div>

<div class="modal" id="dialog" hidden>
  <form id="dialogForm" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <h2 id="dialogTitle"></h2>
    <p id="dialogBody"></p>
    <div class="row">
      <button type="submit" class="danger-solid" id="dialogOk" data-w="shared.dialog.ok">OK</button>
      <button type="button" class="quiet" id="dialogCancel" data-w="mod.cancel">Cancel</button>
    </div>
  </form>
</div>

<?!= scripts ?>
<script>
  var BOOT = <?!= boot ?>;
  fillWords();
  var sid = BOOT.sid;
  var board = document.getElementById('board');
  var tally = document.getElementById('tally');
  var toggle = document.getElementById('toggle');
  var state = null;
  var showOriginals = false;

  document.getElementById('originals').onchange = function () {
    showOriginals = this.checked;
    if (state) draw(state, true);
  };

  if (BOOT.brand.accent) {
    document.documentElement.style.setProperty('--action', BOOT.brand.accent);
    var hx = BOOT.brand.accent.replace('#', '');
    var lum = (parseInt(hx.substr(0, 2), 16) * 299 + parseInt(hx.substr(2, 2), 16) * 587 + parseInt(hx.substr(4, 2), 16) * 114) / 1000;
    if (lum > 150) document.documentElement.style.setProperty('--action-ink', '#16202b');
  }
  if (BOOT.brand.logo) {
    var logo = document.getElementById('logo');
    logo.src = BOOT.brand.logo;
    logo.alt = BOOT.brand.orgName;
    logo.hidden = false;
  }

  var switcher = document.getElementById('switcher');
  switcher.onchange = function () {
    if (!state) return;
    window.top.location.href = state.adminUrl.replace('view=admin', 'view=moderate&s=' + switcher.value);
  };
  google.script.run.withSuccessHandler(function (sessions) {
    if (sessions.length < 2) return;
    sessions.forEach(function (s) {
      var o = document.createElement('option');
      o.value = s.id;
      o.textContent = (s.eventName ? s.eventName + ' — ' : '') + s.name +
        (s.status === 'active' ? '' : W(s.status === 'ended' ? 'mod.optionEnded' : 'mod.optionInactive'));
      if (s.id === sid) o.selected = true;
      switcher.appendChild(o);
    });
    switcher.hidden = false;
    document.getElementById('name').hidden = true;
  }).mySessions();

  var ended = false;

  // In-page confirmation instead of confirm(), which shows the sandbox's googleusercontent.com address.

  // ------------------------------------------------------------ instant updates
  //
  // Every click changes the page immediately, then saves in the background. Apps Script
  // takes a second or more to answer, so waiting for it made buttons feel broken. While
  // a save is in flight, background refreshes don't overwrite what the facilitator just did.

  var pending = 0;
  var saves = 0;        // bumps on every save, so a refresh that read the sheet before it is ignored
  var topicMeta = {};   // votes and phone approval per topic, to restore topics that emptied
  var merging = {};     // topic -> 'busy' or 'failed', kept across redraws
  var mergeErrors = {}; // topic -> why the last merge failed
  var lastRaw = null;   // the last board drawn from the server, to skip identical refreshes
  var saveError = null; // { text, until }

  function showError(text) {
    saveError = { text: text, until: Date.now() + 10000 };
    showUpdated();
  }

  var batch = 0;   // saves sent since the queue was last in step with the server
  var topicsShown = {};   // topics on the board at the last draw, so only new ones animate

  function send(fn, args) {
    pending++;
    saves++;
    batch++;
    var runner = google.script.run
      .withSuccessHandler(function (fresh) {
        pending--;
        if (pending) return;
        // Several quick clicks save in parallel, and the last answer to arrive can be from a save
        // that read the queue before an earlier one landed: drawing it would bring a dismissed
        // question back. After more than one save, read the queue again instead.
        var several = batch > 1;
        batch = 0;
        if (several) load(true);
        else if (fresh && fresh.session) draw(fresh);
      })
      .withFailureHandler(function (err) {
        pending--;
        if (!pending) batch = 0;
        showError(W('mod.saveFailed', { detail: err && err.message ? ' (' + err.message + ')' : '' }));
        load(true);
      });
    runner[fn].apply(runner, args);
  }

  function byAnswered(a, b) {
    return ((a.status === 'answered') - (b.status === 'answered')) || (a.submitted - b.submitted);
  }

  /** Same ordering as the server: open first, answered below, fully answered topics last. */
  function normalize(data) {
    data.dismissed = data.dismissed || [];
    data.unsorted.sort(byAnswered);
    data.topics.forEach(function (t) {
      t.questions.sort(byAnswered);
      t.count = t.questions.length;
      t.answered = t.count > 0 && t.questions.every(function (q) { return q.status === 'answered'; });
      topicMeta[t.topic] = { votes: t.votes, shown: t.shown };
    });
    data.topics = data.topics.filter(function (t) { return t.count > 0; });
    data.topics.sort(function (a, b) {
      return ((b.topic === data.nowAnswering) - (a.topic === data.nowAnswering)) ||   // being answered: top
        (a.answered - b.answered) || ((b.count + b.votes) - (a.count + a.votes));
    });
    data.dismissed.sort(function (a, b) { return b.submitted - a.submitted; });
  }

  function findTopic(name) {
    for (var i = 0; i < state.topics.length; i++) if (state.topics[i].topic === name) return state.topics[i];
    return null;
  }

  function takeQuestion(id) {
    var lists = [state.unsorted, state.dismissed];
    state.topics.forEach(function (t) { lists.push(t.questions); });
    for (var i = 0; i < lists.length; i++) {
      for (var j = 0; j < lists[i].length; j++) {
        if (lists[i][j].id === id) return lists[i].splice(j, 1)[0];
      }
    }
    return null;
  }

  function placeQuestion(q) {
    if (q.status === 'dismissed') { state.dismissed.push(q); return; }
    if (!q.topic) { state.unsorted.push(q); return; }
    var t = findTopic(q.topic);
    if (!t) {
      var meta = topicMeta[q.topic] || { votes: 0, shown: false };
      t = { topic: q.topic, questions: [], count: 0, votes: meta.votes, shown: meta.shown };
      state.topics.push(t);
    }
    t.questions.push(q);
  }

  function act(ids, status) {
    ids.forEach(function (id) {
      var q = takeQuestion(id);
      if (!q) return;
      q.status = status;
      placeQuestion(q);
    });
    // Answering or dismissing what's being answered takes it off the room screen (the server does the same).
    if (status !== 'new') {
      if (state.nowAnsweringQuestion && ids.indexOf(state.nowAnsweringQuestion) !== -1) state.nowAnsweringQuestion = null;
      var live = state.nowAnswering && findTopic(state.nowAnswering);
      if (state.nowAnswering && (!live || !live.questions.some(function (q) { return q.status === 'new'; }))) state.nowAnswering = null;
    }
    normalize(state);
    draw(state, true);
    send('setStatus', [sid, ids, status]);
  }

  function draw(data, local) {
    if (!local) normalize(data);
    if (local) lastRaw = null;   // the next refresh redraws even if it matches the old one
    state = data;
    ended = data.session.status === 'ended';
    document.getElementById('name').textContent = data.session.name;
    var room = document.getElementById('room');
    room.textContent = data.session.room || '';
    room.hidden = !data.session.room;
    document.title = data.session.room
      ? W('mod.pageTitleRoom', { name: data.session.name, room: data.session.room })
      : W('mod.pageTitle', { name: data.session.name });
    var pill = document.getElementById('pill');
    pill.textContent = W(data.session.status === 'active' ? 'mod.pillActive' : ended ? 'mod.pillEnded' : 'mod.pillInactive');
    pill.className = 'pill ' + data.session.status;
    document.getElementById('roomLink').href = data.session.links.present;
    document.getElementById('panelLink').href = data.session.links.panel;
    var adminLink = document.getElementById('adminLink');
    adminLink.href = data.adminUrl;
    adminLink.hidden = !data.isAdmin;
    document.getElementById('endedNotice').hidden = !ended;
    document.querySelector('.bar').hidden = ended;

    document.getElementById('autoGroup').checked = data.autoGroup !== false;
    document.getElementById('autoShow').checked = !!data.autoShowOnPhones;
    document.getElementById('roomQuestions').checked = !!data.roomQuestions;
    document.getElementById('toggleText').textContent = W(data.open ? 'mod.accepting' : 'mod.paused');
    toggle.setAttribute('aria-pressed', data.open ? 'true' : 'false');
    drawPrepared(data.prepared || []);
    drawDismissed(data.dismissed);

    var total = data.unsorted.length;
    data.topics.forEach(function (t) { total += t.count; });
    tally.textContent = W('mod.tally', {
      questions: Wn('mod.tallyQuestions', total),
      topics: Wn('mod.tallyTopics', data.topics.length)
    });

    if (!total) {
      board.appendChild(el('p', 'empty', W('mod.empty')));
      return;
    }

    // Rebuilding the board would close an open ⋯ menu and drop keyboard focus: put them back.
    var openMenu = board.querySelector('details.more[open]');
    openMenu = openMenu && openMenu.getAttribute('data-topic');
    var active = document.activeElement;
    var focusTopic = active && board.contains(active) && active.closest('.topic') ? active.closest('.topic').getAttribute('data-topic') : null;
    var focusKey = focusTopic !== null ? (active.getAttribute('data-key') || active.textContent) : null;
    // Keep the facilitator's place: whatever question (or topic heading) is at the top of the
    // window stays exactly there, even when questions arrive above it.
    var anchor = readingPlace();

    board.innerHTML = '';
    data.topics.forEach(function (t) { board.appendChild(topicBlock(t, data.merged[t.topic], false, data.nowAnswering === t.topic, (data.mergedTranslations || {})[t.topic])); });
    var notice = document.getElementById('groupingNotice');
    notice.hidden = !data.groupingDown || ended;
    notice.textContent = data.groupingDown
      ? W('mod.groupingDown', { detail: data.groupingDown })
      : '';
    if (data.unsorted.length && data.looseGroups && data.looseGroups.length > 1) {
      var byId = {};
      data.unsorted.forEach(function (q) { byId[q.id] = q; });
      data.looseGroups.forEach(function (g) {
        var qs = g.ids.map(function (id) { return byId[id]; }).filter(Boolean);
        if (!qs.length) return;
        var name = g.label ? W('mod.looseMentions', { word: g.label }) : W('mod.looseOther');
        board.appendChild(topicBlock({ topic: name, questions: qs, count: qs.length }, null, true));
      });
    } else if (data.unsorted.length) {
      // With automatic grouping off, these are simply the questions; nothing is waiting on grouping.
      board.appendChild(topicBlock({ topic: W(data.autoGroup === false ? 'mod.questionsGroup' : 'mod.notYetGrouped'), questions: data.unsorted, count: data.unsorted.length }, null, true));
    }

    var blocks = board.querySelectorAll('.topic');
    var shownNow = {};
    for (var i = 0; i < blocks.length; i++) {
      var name = blocks[i].getAttribute('data-topic');
      shownNow[name] = true;
      if (!topicsShown[name]) blocks[i].classList.add('arrived');   // rises in once, when it first appears
      if (openMenu !== null && name === openMenu) {
        var menu = blocks[i].querySelector('details.more');
        if (menu) { menu.open = true; menu.classList.add('kept'); }
      }
      if (focusTopic !== null && name === focusTopic) {
        var candidates = blocks[i].querySelectorAll('button, summary');
        for (var j = 0; j < candidates.length; j++) {
          // preventScroll: focusing used to scroll back to the last clicked button on every refresh.
          if ((candidates[j].getAttribute('data-key') || candidates[j].textContent) === focusKey) { candidates[j].focus({ preventScroll: true }); break; }
        }
      }
    }
    topicsShown = shownNow;
    markSelected(false);
    tickTimers();
    updateSelection();
    keepPlace(anchor);
  }

  /** The first question row (or topic, when none is showing) at the top of the window, and where it is. */
  function readingPlace() {
    if (window.scrollY < 1) return null;   // at the top: new questions may push the page down as usual
    // A question row is the precise anchor; a topic box also grows when questions join it. The
    // first row that starts inside the window is what's being read (one mostly scrolled past
    // isn't), then any row still partly showing, then a topic.
    var rows = board.querySelectorAll('li[data-id]');
    var partly = null;
    for (var i = 0; i < rows.length; i++) {
      var top = layoutTop(rows[i]) - window.scrollY;
      if (top >= 0 && top < window.innerHeight) return { id: rows[i].getAttribute('data-id'), topic: null, top: top };
      if (!partly && top < 0 && top + rows[i].offsetHeight > 0) partly = { id: rows[i].getAttribute('data-id'), topic: null, top: top };
    }
    if (partly) return partly;
    var topics = board.querySelectorAll('.topic');
    for (var j = 0; j < topics.length; j++) {
      var t = layoutTop(topics[j]) - window.scrollY;
      if (t + topics[j].offsetHeight > 0 && t < window.innerHeight) return { id: null, topic: topics[j].getAttribute('data-topic'), top: t };
    }
    return null;
  }

  /**
   * Where an element sits on the page, from layout alone: getBoundingClientRect() includes the
   * short rise animation new topics play, which threw the correction off by its 6px.
   */
  function layoutTop(node) {
    var y = 0;
    for (var n = node; n; n = n.offsetParent) y += n.offsetTop;
    return y;
  }

  /** Scrolls so that the remembered item is back where it was. */
  function keepPlace(anchor) {
    if (!anchor) return;
    var el3 = null;
    if (anchor.id) el3 = board.querySelector('li[data-id="' + anchor.id + '"]');
    if (!el3 && anchor.topic !== null) {
      var topics = board.querySelectorAll('.topic');
      for (var i = 0; i < topics.length; i++) if (topics[i].getAttribute('data-topic') === anchor.topic) { el3 = topics[i]; break; }
    }
    if (!el3) return;   // it left the queue (answered elsewhere, dismissed): nothing to hold on to
    var moved = layoutTop(el3) - window.scrollY - anchor.top;
    if (Math.abs(moved) >= 1) window.scrollBy(0, moved);
  }

  function drawPrepared(list) {
    var box = document.getElementById('prepared');
    box.hidden = ended || !list.length;
    document.getElementById('preparedCount').textContent = W('mod.preparedCount', { n: list.length });
    var ul = document.getElementById('preparedList');
    ul.innerHTML = '';
    list.forEach(function (q) {
      var li = el('li');
      var text = el('div', 'text');
      var translated = q.translation && q.translation !== q.text;
      if (q.logistics) {
        var flag = el('span', 'chip logistics', W(q.sorted ? 'mod.eventTeamDone' : 'mod.eventTeam'));
        flag.title = q.sorted
          ? W('mod.logisticsSorted')
          : W('mod.logistics');
        text.appendChild(flag);
      }
      if (q.lang && translated) {
        var chip = el('span', 'chip');
        chip.textContent = q.lang;
        text.appendChild(chip);
      }
      text.appendChild(document.createTextNode(translated ? q.translation : q.text));
      if (translated && showOriginals) {
        var orig = el('span', 'original');
        orig.textContent = q.text;
        text.appendChild(orig);
      }
      if (q.translations && q.translations.length) {
        text.appendChild(alsoShown(W('mod.alsoShownAnswerNow'), q.translations, 'also'));
      }
      li.appendChild(text);
      var acts = el('div', 'acts');
      var add = el('button', 'primary');
      add.textContent = W('mod.addToQueue');
      add.onclick = function () {
        state.prepared = state.prepared.filter(function (p) { return p.id !== q.id; });
        state.unsorted.push({ id: q.id, text: q.text, lang: q.lang || '', translation: q.translation || '', topic: '', status: 'new', submitted: Date.now() });
        normalize(state);
        draw(state, true);
        send('usePrepared', [sid, [q.id]]);
      };
      acts.appendChild(add);
      li.appendChild(acts);
      ul.appendChild(li);
    });
  }

  function drawDismissed(list) {
    var box = document.getElementById('dismissed');
    box.hidden = !list.length;
    document.getElementById('dismissedCount').textContent = '· ' + list.length;
    var ul = document.getElementById('dismissedList');
    ul.innerHTML = '';
    list.forEach(function (q) {
      var li = el('li');
      var text = el('div', 'text');
      var translated = q.translation && q.translation !== q.text;
      text.textContent = translated ? q.translation : q.text;
      if (q.topic) {
        var where = el('span', 'original');
        where.textContent = q.topic;
        text.appendChild(where);
      }
      li.appendChild(text);
      if (!ended) {
        var acts = el('div', 'acts');
        var restore = el('button');
        restore.textContent = W('mod.restore');
        restore.onclick = function () { act([q.id], 'new'); };
        acts.appendChild(restore);
        li.appendChild(acts);
      }
      ul.appendChild(li);
    });
  }

  /** "Phones show it as Korean: … · Spanish: …" — facilitators approve these along with the label. */
  function alsoShown(intro, list, className) {
    var box = el('div', className);
    var lead = el('span');
    lead.textContent = intro;
    box.appendChild(lead);
    list.forEach(function (tr, i) {
      box.appendChild(document.createTextNode(i ? ' · ' : ' '));
      var b = el('b');
      b.textContent = tr.language + ':';
      box.appendChild(b);
      box.appendChild(document.createTextNode(' ' + tr.text));
    });
    return box;
  }

  var editingMerge = {};      // topic -> true while its read-out question is being edited
  var openTranslations = {};  // topic -> true while its translations are open, kept across refreshes

  function linkButton(label, onClick, key) {
    var b = el('button', 'linkish');
    b.type = 'button';
    b.textContent = label;
    if (key) b.setAttribute('data-key', key);
    b.onclick = onClick;
    return b;
  }

  /** Asks Gemini to write (or rewrite) one question covering the topic. */
  function startMerge(t) {
    merging[t.topic] = 'busy';
    delete mergeErrors[t.topic];
    draw(state, true);
    google.script.run.withSuccessHandler(function (res) {
      if (res.ok) { delete merging[t.topic]; state.merged[t.topic] = res.question; state.mergedTranslations[t.topic] = []; load(true); }
      else { merging[t.topic] = 'failed'; mergeErrors[t.topic] = res.error || W('mod.mergeBadAnswer'); draw(state, true); }
    }).withFailureHandler(function (err) {
      merging[t.topic] = 'failed';
      mergeErrors[t.topic] = W('mod.mergeUnreachable', { detail: (err && err.message) || W('mod.connectionProblem') });
      draw(state, true);
    }).mergeTopic(sid, t.topic);
  }

  /**
   * The topic's read-out question, in one strip under its heading: the question with Edit,
   * Rewrite with Gemini and Remove; or, for a topic of several questions, an offer to write one.
   */
  function readOut(t, mergedText) {
    var topic = t.topic;
    var box = el('div', 'readout');
    var label = el('span', 'readout-label');
    label.textContent = W('mod.readOut');

    if (editingMerge[topic] && !ended) {
      box.classList.add('editing');
      box.appendChild(label);
      var area = el('textarea');
      area.value = mergedText || '';
      area.rows = 2;
      area.maxLength = 400;
      area.setAttribute('aria-label', W('mod.readOutFor', { topic: topic }));
      box.appendChild(area);
      var row = el('div', 'readout-acts');
      var save = el('button', 'small primary');
      save.type = 'button';
      save.textContent = W('mod.save');
      save.onclick = function () {
        var text = area.value.replace(/\s+/g, ' ').trim();
        delete editingMerge[topic];
        if (text) { state.merged[topic] = text; state.mergedTranslations[topic] = []; } else { delete state.merged[topic]; }
        draw(state, true);
        send('setMergedQuestion', [sid, topic, text]);   // translated again on the server
      };
      var cancel = el('button', 'small quiet');
      cancel.type = 'button';
      cancel.textContent = W('mod.cancel');
      cancel.onclick = function () { delete editingMerge[topic]; draw(state, true); };
      row.appendChild(save);
      row.appendChild(cancel);
      box.appendChild(row);
      setTimeout(function () { area.focus(); }, 0);
      return box;
    }

    if (merging[topic] === 'busy') {
      box.classList.add('busy');
      box.appendChild(label);
      box.appendChild(el('span', 'readout-note', W('mod.mergeBusy')));
      return box;
    }

    var failed = merging[topic] === 'failed' && mergeErrors[topic];
    if (mergedText) {
      box.appendChild(label);
      box.appendChild(el('p', 'readout-text', mergedText));
      if (!ended) {
        var acts = el('div', 'readout-acts');
        acts.appendChild(linkButton(W('mod.edit'), function () { editingMerge[topic] = true; draw(state, true); }));
        acts.appendChild(linkButton(W('mod.rewriteWithGemini'), function () { startMerge(t); }, 'merge'));
        acts.appendChild(linkButton(W('mod.remove'), function () {
          delete state.merged[topic];
          draw(state, true);
          send('setMergedQuestion', [sid, topic, '']);
        }));
        box.appendChild(acts);
      }
    } else {
      if (ended || t.count < 2) return failed ? errorStrip(box, label, topic) : null;
      box.classList.add('offer');
      box.appendChild(linkButton(W('mod.writeReadOut'), function () { startMerge(t); }, 'merge'));
      box.appendChild(el('span', 'readout-note', Wn('mod.mergeHint', t.count)));
      box.appendChild(linkButton(W('mod.writeItYourself'), function () { editingMerge[topic] = true; draw(state, true); }));
    }
    if (failed) {
      var why = el('p', 'merge-error', W('mod.mergeFailed', { why: mergeErrors[topic] }));
      why.setAttribute('role', 'alert');
      box.appendChild(why);
    }
    return box;
  }

  function errorStrip(box, label, topic) {
    box.appendChild(label);
    var why = el('p', 'merge-error', W('mod.mergeFailed', { why: mergeErrors[topic] }));
    why.setAttribute('role', 'alert');
    box.appendChild(why);
    return box;
  }

  /** What phones and the room screen show in other languages, folded away until opened. */
  function translationsFor(t, mergedText, mergedTranslations) {
    var labels = t.translations || [];
    var merged = mergedText ? (mergedTranslations || []) : [];
    if (!labels.length && !merged.length) return null;
    var box = el('details', 'translations');
    box.open = !!openTranslations[t.topic];
    box.addEventListener('toggle', function () { if (box.open) openTranslations[t.topic] = true; else delete openTranslations[t.topic]; });
    var names = (labels.length ? labels : merged).map(function (x) { return x.language; });
    box.appendChild(el('summary', null, W('mod.translations', { names: names.join(', ') })));
    if (labels.length) box.appendChild(alsoShown(W(t.shown ? 'mod.trTopicOnPhones' : 'mod.trTopicIfShown'), labels, 'tr-line'));
    if (merged.length) box.appendChild(alsoShown(W('mod.trReadOut'), merged, 'tr-line'));
    return box;
  }

  function topicBlock(t, mergedText, isLoose, isLive, mergedTranslations) {
    var wrap = el('div', 'topic' + (isLive ? ' live' : '') + (t.answered ? ' done' : ''));
    wrap.setAttribute('data-topic', isLoose ? '' : t.topic);

    var head = el('div', 'head');
    var h = el('h2');
    h.textContent = t.topic;
    var c = el('span', 'count');
    c.textContent = Wn(t.answered ? 'mod.topicCountDone' : 'mod.topicCount', t.count);
    h.appendChild(document.createTextNode(' '));
    h.appendChild(c);
    if (t.votes) {
      var v = el('span', 'votes');
      v.textContent = W('mod.meToo', { n: t.votes });
      h.appendChild(v);
    }
    if (isLive) {
      var tag = el('span', 'live-tag');
      tag.textContent = W('mod.answeringNow');
      if (state && state.nowAnsweringSince) tag.setAttribute('data-since', String(state.nowAnsweringSince));
      h.appendChild(tag);
    }
    head.appendChild(h);

    if (!isLoose && !ended) {
      var acts = el('div', 'acts');
      var live = el('button', isLive || t.answered ? '' : 'primary');   // done topics: no loud button
      live.setAttribute('data-key', 'live');
      live.type = 'button';
      live.textContent = W(isLive ? 'mod.stopAnswering' : 'mod.answerNow');
      live.title = isLive
        ? W('mod.stopAnsweringTitle')
        : W('mod.answerNowTitle');
      live.onclick = function () {
        state.nowAnswering = isLive ? null : t.topic;
        state.nowAnsweringQuestion = null;
        state.nowAnsweringSince = isLive ? null : Date.now();
        if (!isLive && state.autoShowOnPhones) { t.shown = true; topicMeta[t.topic] = { votes: t.votes, shown: true }; }
        normalize(state);
        draw(state, true);
        send('setNowAnswering', [sid, isLive ? null : t.topic]);
      };
      acts.appendChild(live);

      var phones = el('button', 'toggle');
      phones.setAttribute('data-key', 'phones');
      phones.type = 'button';
      phones.setAttribute('aria-pressed', t.shown ? 'true' : 'false');
      phones.textContent = W(t.shown ? 'mod.onPhones' : 'mod.showOnPhones');
      phones.title = t.shown
        ? W('mod.onPhonesTitle')
        : W('mod.showOnPhonesTitle');
      phones.onclick = function () {
        t.shown = !t.shown;
        topicMeta[t.topic] = { votes: t.votes, shown: t.shown };
        draw(state, true);
        send('setTopicShown', [sid, t.topic, t.shown]);
      };
      acts.appendChild(phones);

      var more = el('details', 'more');
      more.setAttribute('data-topic', t.topic);
      var summary = el('summary');
      summary.textContent = '⋯';
      summary.setAttribute('aria-label', W('mod.moreActions', { topic: t.topic }));
      more.appendChild(summary);
      var menu = el('div', 'menu');
      var dismissAll = el('button', 'danger');
      dismissAll.type = 'button';
      dismissAll.textContent = Wn('mod.dismissAll', t.count);
      dismissAll.onclick = function () {
        more.open = false;
        ask({ title: W('mod.dismissTopicTitle'), body: Wn('mod.dismissTopicBody', t.count, { topic: t.topic }),
          ok: W('mod.dismissAllOk'), danger: true }, function () {
          act(t.questions.map(function (q) { return q.id; }), 'dismissed');
        });
      };
      menu.appendChild(dismissAll);
      more.appendChild(menu);
      acts.appendChild(more);
      head.appendChild(acts);
    }
    wrap.appendChild(head);

    // Waiting on automatic grouping: said once for the block, not under every question, and
    // only when it's on and questions have waited longer than a run or two.
    if (isLoose && !ended && state && state.autoGroup !== false && !state.groupingDown &&
        t.questions.some(function (q) { return !q.lang && !q.translation && q.status !== 'answered' && Date.now() - q.submitted > 150000; })) {
      var late = el('p', 'group-late', W('mod.groupingLate'));
      wrap.appendChild(late);
    }

    if (!isLoose) {
      var strip = readOut(t, mergedText);
      if (strip) wrap.appendChild(strip);
      var tr = translationsFor(t, mergedText, mergedTranslations);
      if (tr) wrap.appendChild(tr);
    }

    var list = el('ul');
    t.questions.forEach(function (q) {
      var isLiveQuestion = state && state.nowAnsweringQuestion === q.id;
      var li = el('li', (q.status === 'answered' ? 'answered' : '') + (picked[q.id] ? ' picked' : '') + (isLiveQuestion ? ' live-row' : ''));
      li.setAttribute('data-id', q.id);
      if (!ended) {
        var pick = el('input', 'pick');
        pick.type = 'checkbox';
        pick.checked = !!picked[q.id];
        pick.setAttribute('aria-label', W('mod.selectQuestion'));
        pick.onchange = function () {
          if (pick.checked) picked[q.id] = true; else delete picked[q.id];
          li.classList.toggle('picked', pick.checked);
          updateSelection();
        };
        li.appendChild(pick);
      }
      var text = el('div', 'text');

      var translated = q.translation && q.translation !== q.text;
      if (isLiveQuestion) {
        var liveTag = el('span', 'row-live-tag');
        liveTag.textContent = W('mod.answeringNow');
        text.appendChild(liveTag);
      }

      if (q.status === 'answered') {
        var done = el('span', 'done-tag');
        done.textContent = W('mod.answeredTag');
        text.appendChild(done);
      }
      if (q.logistics) {
        var flag = el('span', 'chip logistics', W(q.sorted ? 'mod.eventTeamDone' : 'mod.eventTeam'));
        flag.title = q.sorted
          ? W('mod.logisticsSorted')
          : W('mod.logistics');
        text.appendChild(flag);
      }
      if (q.lang && translated) {
        var chip = el('span', 'chip');
        chip.textContent = q.lang;
        text.appendChild(chip);
      }
      text.appendChild(document.createTextNode(translated ? q.translation : q.text));
      if (isLoose && q.votes) {
        var qv = el('span', 'votes');
        qv.textContent = W('mod.meToo', { n: q.votes });
        text.appendChild(qv);
      }

      if (translated && showOriginals) {
        var orig = el('span', 'original');
        orig.textContent = q.text;
        text.appendChild(orig);
      }
      li.appendChild(text);
      list.appendChild(li);
      if (ended) return;

      var acts2 = el('div', 'acts');
      if (isLoose && q.status !== 'answered') {
        // No need to wait for grouping: put this one question up on its own.
        var liveOne = el('button', isLiveQuestion ? 'small' : 'small primary');   // the one solid action
        liveOne.setAttribute('data-key', 'live');
        liveOne.type = 'button';
        liveOne.textContent = W(isLiveQuestion ? 'mod.stopAnswering' : 'mod.answerNow');
        liveOne.title = W('mod.answerNowQuestionTitle');
        liveOne.onclick = function () {
          state.nowAnswering = null;
          state.nowAnsweringQuestion = isLiveQuestion ? null : q.id;
          state.nowAnsweringSince = isLiveQuestion ? null : Date.now();
          if (!isLiveQuestion && state.autoShowOnPhones) q.shown = true;
          draw(state, true);
          send('setNowAnswering', [sid, null, isLiveQuestion ? null : q.id]);
        };
        acts2.appendChild(liveOne);

        // Same as a topic's: a quiet session may never be grouped, and people still want Me too.
        var phonesOne = el('button', 'small quiet toggle');
        phonesOne.setAttribute('data-key', 'phones');
        phonesOne.type = 'button';
        phonesOne.setAttribute('aria-pressed', q.shown ? 'true' : 'false');
        phonesOne.textContent = W(q.shown ? 'mod.phonesOn' : 'mod.phones');
        phonesOne.title = q.shown
          ? W('mod.phonesOnTitle')
          : W('mod.phonesTitle');
        phonesOne.onclick = function () {
          q.shown = !q.shown;
          draw(state, true);
          send('setQuestionShown', [sid, q.id, q.shown]);
        };
        acts2.appendChild(phonesOne);
      }
      var mark = el('button', 'small quiet');
      mark.setAttribute('data-key', 'mark');
      mark.type = 'button';
      mark.textContent = W(q.status === 'answered' ? 'mod.reopen' : 'mod.answered');
      mark.title = W(q.status === 'answered' ? 'mod.reopenTitle' : 'mod.answeredTitle');
      mark.onclick = function () { act([q.id], q.status === 'answered' ? 'new' : 'answered'); };
      var drop = el('button', 'small quiet');
      drop.setAttribute('data-key', 'drop');
      drop.type = 'button';
      drop.textContent = W('mod.dismiss');
      drop.title = W('mod.dismissTitle');
      drop.onclick = function () { act([q.id], 'dismissed'); };
      acts2.appendChild(mark);
      acts2.appendChild(drop);
      li.appendChild(acts2);
    });
    wrap.appendChild(list);
    return wrap;
  }


  toggle.onclick = function () {
    if (!state) return;   // not loaded yet
    state.open = !state.open;
    draw(state, true);
    send('setBoardOpen', [sid, state.open]);
  };

  document.getElementById('cluster').onclick = function () {
    var b = this;
    b.disabled = true;
    b.textContent = W('mod.grouping');
    google.script.run.withSuccessHandler(function () {
      b.disabled = false;
      b.textContent = W('mod.groupNow');
      load(true);
    }).withFailureHandler(function () {
      b.disabled = false;
      b.textContent = W('mod.groupingFailed');
    }).groupNow(sid);
  };


  function load(force) {
    if (ended && !force) return;
    var savesAtStart = saves;
    google.script.run.withSuccessHandler(function (fresh) {
      lastLoaded = Date.now();
      showUpdated();
      if (pending && !force) return;   // a save is in flight; its answer will redraw
      if (savesAtStart !== saves) return;   // read before a save landed; it would undo the click on screen
      var raw = JSON.stringify(fresh);
      if (raw === lastRaw && !force) return;   // nothing changed: leave menus, focus and scroll alone
      lastRaw = raw;
      draw(fresh);
    }).withFailureHandler(function (err) {
      tally.textContent = err && err.message ? err.message : W('mod.lostConnection');
    }).getBoard(sid);
  }

  // Shows the queue is live; warns if refreshes stop arriving.
  var lastLoaded = 0;
  function showUpdated() {
    var el2 = document.getElementById('updated');
    if (saveError && Date.now() < saveError.until) {
      el2.className = 'updated stale';
      el2.textContent = saveError.text;
      return;
    }
    if (!lastLoaded) { el2.textContent = W('mod.loading'); return; }
    var stale = !ended && Date.now() - lastLoaded > 20000;
    el2.className = stale ? 'updated stale' : 'updated';
    el2.textContent = stale
      ? W('mod.notUpdating')
      : W('mod.updated', { at: new Date(lastLoaded).toLocaleTimeString(BOOT.lang, { hour: 'numeric', minute: '2-digit', second: '2-digit' }) });
  }
  setInterval(showUpdated, 1000);

  // ------------------------------------------------------------ selecting and grouping by hand

  var picked = {};

  function pickedIds() {
    // Only questions still on the board (a refresh may have moved some to Dismissed).
    return Object.keys(picked).filter(function (id) { return board.querySelector('li[data-id="' + id + '"]'); });
  }

  function updateSelection() {
    var ids = pickedIds();
    Object.keys(picked).forEach(function (id) { if (ids.indexOf(id) === -1) delete picked[id]; });
    var bar = document.getElementById('selection');
    bar.hidden = !ids.length || ended;
    document.getElementById('selCount').textContent = Wn('mod.selCount', ids.length);
    var anyGrouped = ids.some(function (id) { var li = board.querySelector('li[data-id="' + id + '"]'); return li && li.closest('.topic').getAttribute('data-topic'); });
    document.getElementById('selUngroup').hidden = !anyGrouped;
  }

  function clearPicked() {
    picked = {};
    var boxes = board.querySelectorAll('input.pick');
    for (var i = 0; i < boxes.length; i++) { boxes[i].checked = false; boxes[i].closest('li').classList.remove('picked'); }
    updateSelection();
  }

  function moveTo(ids, topic) {
    ids.forEach(function (id) {
      var q = takeQuestion(id);
      if (!q) return;
      q.topic = topic;
      placeQuestion(q);
    });
    picked = {};
    normalize(state);
    draw(state, true);
  }

  document.getElementById('selClear').onclick = clearPicked;
  document.getElementById('selAnswered').onclick = function () { var ids = pickedIds(); picked = {}; act(ids, 'answered'); };
  document.getElementById('selDismiss').onclick = function () { var ids = pickedIds(); picked = {}; act(ids, 'dismissed'); };
  document.getElementById('selUngroup').onclick = function () {
    var ids = pickedIds();
    moveTo(ids, '');
    send('ungroupQuestions', [sid, ids]);
  };
  document.getElementById('selGroup').onclick = function () {
    var list = document.getElementById('topicNames');
    list.innerHTML = '';
    state.topics.forEach(function (t) { var o = el('option'); o.value = t.topic; list.appendChild(o); });
    var n = pickedIds().length;
    document.getElementById('groupTitle').textContent = 'Group ' + n + (n === 1 ? ' question' : ' questions');
    document.getElementById('groupName').value = '';
    document.getElementById('groupDialog').hidden = false;
    document.getElementById('groupName').focus();
  };
  function closeGroup() { document.getElementById('groupDialog').hidden = true; }
  document.getElementById('groupCancel').onclick = closeGroup;
  document.getElementById('groupDialog').addEventListener('click', function (e) { if (e.target === this) closeGroup(); });
  document.getElementById('groupForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = document.getElementById('groupName').value.replace(/\s+/g, ' ').trim();
    if (!name) { document.getElementById('groupName').focus(); return; }
    var ids = pickedIds();
    closeGroup();
    moveTo(ids, name);
    send('groupQuestions', [sid, ids, name]);
  });

  document.getElementById('autoGroup').onchange = function () {
    if (!state) return;
    state.autoGroup = this.checked;
    draw(state, true);
    send('setAutoGroup', [sid, this.checked]);
  };
  document.getElementById('autoShow').onchange = function () {
    if (!state) return;
    state.autoShowOnPhones = this.checked;
    send('setAutoShowOnPhones', [sid, this.checked]);
  };
  document.getElementById('roomQuestions').onchange = function () {
    if (!state) return;
    state.roomQuestions = this.checked;
    send('setRoomQuestions', [sid, this.checked]);
  };

  // ------------------------------------------------------------ timer for the live topic

  function tickTimers() {
    var tags = board.querySelectorAll('.live-tag[data-since]');
    for (var i = 0; i < tags.length; i++) {
      var secs = Math.max(0, Math.floor((Date.now() - Number(tags[i].getAttribute('data-since'))) / 1000));
      var m = Math.floor(secs / 60), r = secs % 60;
      tags[i].textContent = W('mod.answeringNowTimer', { time: m + ':' + (r < 10 ? '0' : '') + r });
    }
  }
  setInterval(tickTimers, 1000);

  // ------------------------------------------------------------ keyboard shortcuts

  var selectedId = null;

  function questionRows() {
    return Array.prototype.slice.call(board.querySelectorAll('li[data-id]'));
  }

  function markSelected(scroll) {
    var rows = questionRows();
    rows.forEach(function (row) {
      var on = row.getAttribute('data-id') === selectedId;
      row.classList.toggle('selected', on);
      if (on && scroll && row.scrollIntoView) row.scrollIntoView({ block: 'nearest' });
    });
  }

  function selectedRow() {
    return selectedId ? board.querySelector('li[data-id="' + selectedId + '"]') : null;
  }

  function moveSelection(delta) {
    var rows = questionRows();
    if (!rows.length) return;
    var at = -1;
    for (var i = 0; i < rows.length; i++) if (rows[i].getAttribute('data-id') === selectedId) at = i;
    var next = at === -1 ? (delta > 0 ? 0 : rows.length - 1) : Math.min(rows.length - 1, Math.max(0, at + delta));
    selectedId = rows[next].getAttribute('data-id');
    markSelected(true);
  }

  /** Clicks a button in the selected question's row, or in its topic's header. */
  function press(where, test) {
    var row = selectedRow();
    if (!row) { moveSelection(1); return; }
    var scope = where === 'row' ? row : where === 'topicAll' ? row.closest('.topic') : row.closest('.topic').querySelector('.head');
    if (!scope) return;
    var buttons = scope.querySelectorAll('button');
    for (var i = 0; i < buttons.length; i++) {
      if (!buttons[i].disabled && test(buttons[i])) { buttons[i].click(); return true; }
    }
    return false;
  }

  // The letters are the keys themselves; only what they do is written out.
  var SHORTCUTS = [
    [W('mod.keys.nextPress'), W('mod.keys.next')], [W('mod.keys.prevPress'), W('mod.keys.prev')],
    ['X', W('mod.keys.tick')],
    ['A', W('mod.keys.answered')], ['D', W('mod.keys.dismiss')],
    ['N', W('mod.keys.live')], ['P', W('mod.keys.phones')],
    ['M', W('mod.keys.merge')], ['G', W('mod.keys.group')],
    ['O', W('mod.keys.originals')], ['Esc', W('mod.keys.clear')], ['?', W('mod.keys.list')]
  ];

  document.getElementById('keysHelp').onclick = function () {
    ask({ title: W('mod.keysTitle'), body: SHORTCUTS.map(function (k) { return k[0] + '  —  ' + k[1]; }).join('\n'),
      ok: W('mod.keysOk'), danger: true, noCancel: true }, function () {});
  };

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey || ended) return;
    var t = e.target;
    // Typing fields keep their keys; checkboxes and buttons don't need them.
    if (t && ((t.tagName === 'INPUT' && !/^(checkbox|radio|button|submit)$/i.test(t.type)) || /^(TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
    if (!document.getElementById('dialog').hidden || !document.getElementById('groupDialog').hidden) return;
    var key = e.key;
    var handled = true;
    if (key === 'j' || key === 'ArrowDown') moveSelection(1);
    else if (key === 'k' || key === 'ArrowUp') moveSelection(-1);
    else if (key === 'a' || key === 'd') {
      var row = selectedRow();
      var reopening = row && row.classList.contains('answered') && key === 'a';
      // Triage flow: after answering or dismissing, move on to the next question.
      var rows = questionRows();
      var at = row ? rows.indexOf(row) : -1;
      var nextId = !reopening && at !== -1 && rows[at + 1] ? rows[at + 1].getAttribute('data-id') : selectedId;
      if (press('row', function (b) { return b.getAttribute('data-key') === (key === 'a' ? 'mark' : 'drop'); })) {
        selectedId = nextId;
        markSelected(true);
      }
    }
    else if (key === 'n') {
      if (!press('row', function (b) { return b.getAttribute('data-key') === 'live'; })) {
        press('topic', function (b) { return b.getAttribute('data-key') === 'live'; });
      }
    }
    else if (key === 'x') {
      var pickRow = selectedRow();
      var box = pickRow && pickRow.querySelector('input.pick');
      if (box) box.click(); else moveSelection(1);
    }
    else if (key === 'p') {
      var isPhones = function (b) { return b.getAttribute('data-key') === 'phones'; };
      if (!press('row', isPhones)) press('topic', isPhones);
    }
    else if (key === 'm') press('topicAll', function (b) { return b.getAttribute('data-key') === 'merge'; });
    else if (key === 'g') document.getElementById('cluster').click();
    else if (key === 'o') document.getElementById('originals').click();
    else if (key === '?') document.getElementById('keysHelp').click();
    else if (key === 'Escape') { selectedId = null; markSelected(false); handled = false; }
    else handled = false;
    if (handled) e.preventDefault();
  });

  load(true);
  setInterval(load, 5000);
</script>
</body>
