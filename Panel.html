<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<?!= styles ?>
</head>
<body>
<div class="top">
  <span id="brand"><img id="logo" alt="" hidden><span id="org"></span></span>
  <span id="session"></span>
</div>

<main aria-live="polite">
  <div id="live" hidden>
    <div class="label"><span data-w="panel.nowAnswering">Now answering</span><span class="timer" id="timer" data-w-t="panel.timerTitle" title="Time on this question"></span></div>
    <p class="topic" id="topic"></p>
    <p class="question" id="question"></p>
  </div>
  <p class="waiting" id="waiting" data-w="panel.waiting">Waiting for the facilitator to choose a question.</p>
</main>

<div class="foot">
  <span id="status" data-w="panel.live">Updates automatically</span>
  <span id="clock"></span>
</div>

<?!= scripts ?>
<script>
  var BOOT = <?!= boot ?>;
  var brand = BOOT.brand || {};
  fillWords();
  var since = null;
  var lastOk = Date.now();


  if (BOOT.theme === 'light') document.body.className = 'light';
  if (brand.accent) document.documentElement.style.setProperty('--action', brand.accent);
  if (brand.logo) { $('logo').src = brand.logo; $('logo').alt = brand.orgName || ''; $('logo').hidden = false; }
  else $('org').textContent = brand.orgName || '';

  function two(n) { return (n < 10 ? '0' : '') + n; }

  function tick() {
    var now = new Date();
    $('clock').textContent = now.toLocaleTimeString(BOOT.lang, { hour: 'numeric', minute: '2-digit' });
    if (since) {
      var secs = Math.max(0, Math.floor((Date.now() - since) / 1000));
      var m = Math.floor(secs / 60);
      $('timer').textContent = m + ':' + two(secs % 60);
      $('timer').className = m >= 5 ? 'timer long' : 'timer';
    }
    var stale = Date.now() - lastOk > 30000;
    $('status').textContent = W(stale ? 'panel.stale' : 'panel.live');
    $('status').className = stale ? 'stale' : '';
  }

  function show(screen) {
    lastOk = Date.now();
    tellFrame(frameState(screen));   // the guest page reloads a view that went quiet or is outdated
    $('session').textContent = screen.heading || '';
    var now = screen.nowAnswering;
    $('live').hidden = !now;
    $('waiting').hidden = !!now;
    if (screen.status === 'ended') $('waiting').textContent = W('panel.ended');
    else if (screen.status !== 'active') $('waiting').textContent = W('panel.notStarted');
    else $('waiting').textContent = W('panel.waiting');
    if (now) {
      var en = function (labels) { return labels ? (labels.en || '') : ''; };
      var merged = now.merged ? en(now.merged) : '';
      $('topic').textContent = merged ? en(now.labels) : '';
      $('topic').hidden = !merged;
      $('question').textContent = merged || en(now.labels);
      since = now.since || since || Date.now();
    } else {
      since = null;
    }
    tick();
  }

  function load() {
    google.script.run.withSuccessHandler(show).withFailureHandler(function () { tick(); })
      .getRoomScreen(BOOT.sid, 'panel', BOOT.key);
  }

  load();
  setInterval(load, 5000);
  setInterval(tick, 1000);
</script>
</body>
</html>
