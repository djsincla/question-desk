<!DOCTYPE html>
<html>
<head>
<base target="_top">
<!-- integrity: a tampered copy on the CDN can't put a different address in the room's QR code. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<?!= styles ?>
</head>
<body class="dark">

<div class="band"></div>
<div class="brand" id="brand" hidden>
  <img id="logo" alt="" hidden>
  <span id="org"></span>
</div>
<div class="footer" id="footer" hidden></div>

<div class="words">
  <h1 id="heading">Ask the panel</h1>
  <p lang="en" id="scanEn"></p>
  <span id="scanLines"></span>
  <!-- Google can refuse to open Apps Script pages in browsers signed into several Google
       accounts ("Sorry, unable to open the file"). Its error page can't carry our help. -->
  <p class="help" id="helpLine"><span lang="en" id="helpEn"></span></p>
  <!-- Session option: what phones show, most Me too first (getRoomScreen's asked). -->
  <div class="asked" id="asked" hidden>
    <div class="asked-title" id="askedTitle"></div>
    <ol id="askedList"></ol>
  </div>
</div>

<div class="code" id="code" hidden></div>
<div class="waiting" id="waiting"></div>

<div class="now" id="now" hidden>
  <div class="tag">Now answering</div>
  <div class="label" id="nowLabel"></div>
  <div class="others" id="nowOthers"></div>
  <div class="merged" id="nowMerged" hidden></div>
</div>

<div class="caption" id="caption" lang="en"><br><span id="captionLines"></span><small class="help" id="captionHelp"></small></div>

<div class="status" id="status"></div>
<div class="clock" id="clock" aria-live="off"></div>

<?!= scripts ?>
<script>
  var BOOT = <?!= boot ?>;
  fillWords();

  var box = document.getElementById('code');
  var waiting = document.getElementById('waiting');
  // Not "status": a top-level var named status is window.status, which only holds text.
  var statusLine = document.getElementById('status');
  var shownUrl = '';
  var theme = BOOT.theme || 'dark';
  var brand = BOOT.brand;
  var themeOverride = null;   // press T to cycle dark → light → high contrast, e.g. if the projector washes out

  // Instructions in the session's languages (its event's choice), from UI_TEXT.screen in Code.js.
  var PHRASES = BOOT.text;
  var LANGS = (BOOT.languages && BOOT.languages.length ? BOOT.languages : ['en', 'ko', 'es'])
    .filter(function (c) { return c === 'en' || PHRASES[c]; });

  /**
   * A phrase the room reads, in the language this screen speaks (its session's Room language).
   * The stacked instructions below use every language the session offers; these lines replace
   * the code itself, so they show one.
   */
  function roomSay(key, count) {
    var said = ((PHRASES[BOOT.lang] || PHRASES.en)[key] || PHRASES.en[key] || '');
    return count === undefined ? said : said.replace('{n}', count);
  }

  (function writeLanguages() {
    document.getElementById('scanEn').textContent = PHRASES.en.scan;
    document.getElementById('helpEn').textContent = PHRASES.en.help;
    // Plain text, not a span: the caption's spans are the other languages, shown muted.
    var captionBox = document.getElementById('caption');
    captionBox.insertBefore(document.createTextNode(PHRASES.en.caption), captionBox.firstChild);
    document.getElementById('captionHelp').textContent = PHRASES.en.help;
    var lines = document.getElementById('scanLines');
    var help = document.getElementById('helpLine');
    var caption = document.getElementById('captionLines');
    var captionParts = [];
    LANGS.forEach(function (code) {
      if (code === 'en') return;
      var p = document.createElement('p');
      p.lang = code;
      p.textContent = PHRASES[code].scan;
      lines.parentNode.insertBefore(p, lines);
      var h = document.createElement('span');
      h.lang = code;
      h.textContent = ' ' + PHRASES[code].help;
      help.appendChild(h);
      captionParts.push(code);
    });
    lines.parentNode.removeChild(lines);
    captionParts.forEach(function (code, i) {
      if (i) caption.appendChild(document.createTextNode(' · '));
      var c = document.createElement('span');
      c.lang = code;
      c.textContent = PHRASES[code].caption;
      caption.appendChild(c);
    });
  })();

  function inkFor(hex) {
    var h = String(hex || '').replace('#', '');
    var r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
    return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? '#16202b' : '#ffffff';
  }

  function applyTheme() {
    var t = themeOverride || theme;
    var idle = document.body.classList.contains('idle');
    var qrOnly = BOOT.layout === 'qr';
    var contrast = t === 'contrast';
    // High contrast: black, white and a strong yellow, whatever the branding.
    document.body.className = (contrast ? 'dark contrast' : t) + (qrOnly ? ' qr-only' : (document.getElementById('now').hidden ? '' : ' answering')) + (idle ? ' idle' : '');
    var s = document.body.style;
    if (contrast) {
      s.setProperty('--bg', '#000000');
      s.setProperty('--accent', '#ffd400');
      s.setProperty('--accent-ink', '#000000');
      s.setProperty('--ink', '#ffffff');
      s.setProperty('--muted', '#ffffff');
      s.setProperty('--faint', '#d6d6d6');
      return;
    }
    s.setProperty('--bg', t === 'light' ? brand.roomBgLight : brand.roomBgDark);
    s.setProperty('--accent', brand.accent);
    s.setProperty('--accent-ink', inkFor(brand.accent));
    // A custom background can be light in dark mode or vice versa; keep text readable.
    var bgInk = inkFor(t === 'light' ? brand.roomBgLight : brand.roomBgDark);
    s.setProperty('--ink', bgInk);
    s.setProperty('--muted', bgInk === '#ffffff' ? '#9dabb8' : '#5c6874');
    s.setProperty('--faint', bgInk === '#ffffff' ? '#4d5b69' : '#9aa4ad');
  }

  function applyBrand() {
    // Most logos already contain the name; show the text only when there is no logo.
    document.getElementById('org').textContent = brand.logo ? '' : (brand.orgName || '');
    document.getElementById('brand').hidden = !(brand.logo || brand.orgName);
    var footer = document.getElementById('footer');
    footer.textContent = brand.footer || '';
    footer.hidden = !brand.footer;
  }

  if (brand.logo) {
    var logo = document.getElementById('logo');
    logo.src = brand.logo;
    logo.alt = brand.orgName;
    logo.hidden = false;
  }
  applyBrand();
  applyTheme();

  // A projector never needs a pointer; hide it after a few still seconds.
  var idleTimer = null;
  document.addEventListener('mousemove', function () {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { document.body.classList.add('idle'); }, 3000);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 't' || e.key === 'T') {
      var order = ['dark', 'light', 'contrast'];
      themeOverride = order[(order.indexOf(themeOverride || theme) + 1) % order.length];
      applyTheme();
      fit();
    }
  });

  // qrcode.js draws a canvas and an image and hides one; some web views (PowerPoint on
  // Mac) showed both, stacked. We use the library only for the pattern and draw a single SVG.
  var scratch = document.createElement('div');


  function render(url) {
    if (url === shownUrl) return;
    shownUrl = url;
    scratch.innerHTML = '';
    var generator = new QRCode(scratch, { text: url, width: 64, height: 64, correctLevel: QRCode.CorrectLevel.M });
    var model = generator._oQRCode;
    while (box.firstChild) box.removeChild(box.firstChild);

    if (!model || !model.getModuleCount) {
      // Library internals changed: fall back to its own image (the canvas is hidden by CSS).
      var img = scratch.querySelector('img');
      if (img) box.appendChild(img);
      return;
    }
    box.appendChild(qrArt(model, roomSay('qrLabel')));
  }

  /**
   * Shrinks the text (the --fit multiplier) until no part overlaps another or runs off the
   * screen: headings, languages, logos and topics vary, and a projector can't scroll.
   */
  var FIT_PARTS = '.brand, .footer, .words > *, #code, #waiting, .now, .caption, .status, .clock';
  function crowded() {
    var boxes = [];
    var nodes = document.querySelectorAll(FIT_PARTS);
    for (var i = 0; i < nodes.length; i++) {
      var r = nodes[i].getBoundingClientRect();
      if (r.width < 2 || r.height < 2 || getComputedStyle(nodes[i]).display === 'none') continue;
      if (r.left < -1 || r.top < -1 || r.right > innerWidth + 1 || r.bottom > innerHeight + 1) return true;
      for (var j = 0; j < boxes.length; j++) {
        var b = boxes[j];
        if (r.left + 1 < b.right && b.left + 1 < r.right && r.top + 1 < b.bottom && b.top + 1 < r.bottom) return true;
      }
      boxes.push(r);
    }
    return false;
  }
  function fit() {
    var scale = 1;
    document.body.style.setProperty('--fit', '1');
    while (scale > 0.45 && crowded()) {
      scale = Math.round((scale - 0.05) * 100) / 100;
      document.body.style.setProperty('--fit', String(scale));
    }
  }
  var fitTimer = null;
  window.addEventListener('resize', function () { clearTimeout(fitTimer); fitTimer = setTimeout(fit, 150); });

  function showWaiting(text) {
    box.hidden = true;
    waiting.hidden = false;
    waiting.textContent = text;
    shownUrl = '';
  }

  /** The room's questions, when the session lists them: English, then the session's other languages. */
  function showAsked(list) {
    var box = document.getElementById('asked');
    var ol = document.getElementById('askedList');
    box.hidden = !list || !list.length;
    while (ol.firstChild) ol.removeChild(ol.firstChild);
    if (box.hidden) return;
    document.getElementById('askedTitle').textContent = LANGS.map(function (code) { return PHRASES[code].asked; }).join('  ·  ');
    list.forEach(function (item) {
      var li = document.createElement('li');
      var label = document.createElement('span');
      label.className = 'asked-label';
      label.textContent = item.labels.en;
      var others = LANGS.filter(function (code) { return code !== 'en' && item.labels[code] && item.labels[code] !== item.labels.en; })
        .map(function (code) { return item.labels[code]; });
      if (others.length) {
        var o = document.createElement('span');
        o.className = 'asked-others';
        o.textContent = others.join('  ·  ');
        label.appendChild(o);
      }
      var count = document.createElement('span');
      count.className = 'asked-count';
      count.textContent = String(item.count);
      count.setAttribute('aria-label', item.count === 1 ? roomSay('person') : roomSay('people', item.count));
      li.appendChild(label);
      li.appendChild(count);
      ol.appendChild(li);
    });
  }

  function showNow(now) {
    var panel = document.getElementById('now');
    panel.hidden = !now;
    if (now) {
      document.getElementById('nowLabel').textContent = now.labels.en;
      var others = [];
      LANGS.forEach(function (code) {
        if (code !== 'en' && now.labels[code] && now.labels[code] !== now.labels.en) others.push(now.labels[code]);
      });
      document.getElementById('nowOthers').textContent = others.join('  ·  ');
      var merged = document.getElementById('nowMerged');
      merged.hidden = !now.merged;
      if (now.merged) merged.textContent = now.merged.en;
    }
    applyTheme();
  }

  // Refresh loop with a watchdog. google.script.run can hang without calling either
  // handler (sleeping laptop, PowerPoint pausing its web view, flaky wifi); a hung call
  // must never leave an expired code on screen.
  var lastOk = 0;          // when the server last answered
  var requestId = 0;       // answers to superseded requests are ignored
  var requestedAt = 0;
  var nextTimer = null;
  var ended = false;

  function schedule(seconds) {
    clearTimeout(nextTimer);
    nextTimer = setTimeout(refresh, seconds * 1000);
  }

  function refresh() {
    var id = ++requestId;
    requestedAt = Date.now();
    google.script.run.withSuccessHandler(function (screen) {
      if (id !== requestId) return;
      lastOk = Date.now();
      theme = screen.theme;
      screen.brand.logo = brand.logo;
      brand = screen.brand;
      applyBrand();
      document.getElementById('heading').textContent = screen.heading;
      showNow(screen.status === 'active' ? screen.nowAnswering : null);
      showAsked(screen.status === 'active' ? screen.asked : null);

      if (screen.status === 'ended') {
        ended = true;
        showWaiting(roomSay('ended'));
        statusLine.textContent = '';
      } else if (screen.status !== 'active' || !screen.url) {
        showWaiting(roomSay('openSoon'));
        statusLine.textContent = W('present.waitingToStart');
      } else {
        render(screen.url);
        waiting.hidden = true;
        box.hidden = false;
        statusLine.textContent = W(screen.open ? 'present.codeRefreshes' : 'present.paused');
      }
      tick();
      fit();
      tellFrame(frameState(screen));
      if (!ended) schedule(screen.refreshInSeconds);
    }).withFailureHandler(function (err) {
      if (id !== requestId) return;
      var message = err && err.message || '';
      if (/out of date|not found/i.test(message)) {
        // Not a connection problem: say so instead of leaving an old code on screen.
        showWaiting(message);
        statusLine.textContent = '';
        tellFrame('refused');
        fit();
      } else {
        statusLine.textContent = W('present.lostConnection');
      }
      schedule(15);
    }).getRoomScreen(BOOT.sid, BOOT.layout, BOOT.key);
  }

  function clockText(ms) {
    return new Date(ms).toLocaleTimeString(BOOT.lang, { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  }

  function tick() {
    var now = Date.now();
    var clock = document.getElementById('clock');
    var stale = !ended && lastOk && now - lastOk > 60000;
    clock.textContent = clockText(now) + (lastOk ? W('present.codeUpdated', { at: clockText(lastOk) }) : '');
    clock.className = stale ? 'clock stale' : 'clock';
    if (stale) {
      statusLine.textContent = W('present.stale');
      statusLine.className = 'status stale';
      box.classList.add('dim');
    } else {
      statusLine.className = 'status';
      box.classList.remove('dim');
    }
  }

  setInterval(function () {
    tick();
    if (ended) return;
    var now = Date.now();
    // A call that hasn't answered in 40 s is treated as lost: ask again. (No page
    // reload: inside Google's sandboxed frame that can leave the screen blank.)
    if (now - requestedAt > 40000) refresh();
  }, 1000);

  showWaiting(roomSay('loading'));
  fit();
  refresh();
</script>
</body>
</html>
