<!DOCTYPE html>
<html>
<head>
<base target="_top">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    --bg: #10171f;
    --ink: #ffffff;
    --muted: #9dabb8;
    --faint: #4d5b69;
    --accent: #1b5e5a;
    --accent-ink: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6vw;
    padding: 12vh 5vw 8vh;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    transition: background 0.3s, color 0.3s;
  }
  body.light {
    --ink: #16202b;
    --muted: #5c6874;
    --faint: #9aa4ad;
  }
  body.answering { padding-bottom: 30vh; }
  /* QR-only layout for a box on a slide (PowerPoint add-in). */
  .caption { display: none; }
  body.qr-only { flex-direction: column; gap: 2.5vh; padding: 4vh 4vw; }
  body.qr-only .words, body.qr-only .brand, body.qr-only .footer, body.qr-only .band,
  body.qr-only .now, body.qr-only .status { display: none !important; }
  /* Leave room for the caption and clock whatever fonts the computer uses. */
  body.qr-only .code svg, body.qr-only .code img, body.qr-only .waiting { width: min(60vh, 86vw); }
  body.qr-only .code { padding: 2vmin; box-shadow: 0 0 0 0.6vmin var(--accent); }
  body.qr-only .caption { display: block; text-align: center; color: var(--ink); font-size: clamp(0.8rem, 4.2vmin, 2.2rem); line-height: 1.25; }
  body.qr-only .caption span { color: var(--muted); }
  .band { position: fixed; top: 0; left: 0; right: 0; height: 0.8vh; background: var(--accent); }
  .brand { position: fixed; top: 4vh; left: 5vw; display: flex; align-items: center; gap: 1.2vw; }
  .brand img { max-height: 9vh; max-width: 24vw; }
  .brand span { font-size: clamp(0.9rem, 1.5vw, 1.4rem); color: var(--muted); }
  body.dark .brand img { background: #fff; padding: 0.8vh 1vw; border-radius: 6px; }
  /* The text takes whatever the QR code doesn't need, so headings stay on one or two lines. */
  .words { flex: 1 1 auto; min-width: 0; max-width: 62vw; }
  .code, .waiting { flex: 0 0 auto; }
  /* Sized by the box's width *and* height, so short boxes get smaller text. */
  h1 { font-size: clamp(1.1rem, min(4.6vw, 8vh), 4.6rem); line-height: 1.08; margin: 0 0 0.45em; font-weight: 600; text-wrap: balance; }
  p { font-size: clamp(0.7rem, min(1.6vw, 2.9vh), 1.55rem); line-height: 1.35; margin: 0 0 0.5em; color: var(--muted); }
  body.idle, body.idle * { cursor: none !important; }
  p:last-of-type { margin-bottom: 0; }
  .code {
    background: #fff;
    padding: 2.5vh;
    border-radius: 8px;
    line-height: 0;
    box-shadow: 0 0 0 0.5vh var(--accent);
  }
  /* One SVG, drawn from the QR pattern: crisp at any size, and nothing to duplicate. */
  .code svg, .code img { display: block; width: min(38vh, 38vw); height: auto; aspect-ratio: 1; }
  .code canvas { display: none !important; }
  .waiting {
    width: min(38vh, 38vw);
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    border: 2px dashed var(--faint);
    border-radius: 8px;
    color: var(--muted);
    font-size: clamp(1rem, 1.8vw, 1.6rem);
    padding: 2vw;
    line-height: 1.3;
  }
  .now {
    position: fixed;
    left: 5vw;
    right: 5vw;
    bottom: 6vh;
    background: var(--accent);
    color: var(--accent-ink);
    border-radius: 10px;
    padding: 2.4vh 2.5vw;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.6vh 2.5vw;
    align-items: baseline;
  }
  .now .tag { grid-row: span 3; text-transform: uppercase; letter-spacing: 0.08em; font-size: clamp(0.8rem, 1.3vw, 1.2rem); font-weight: 700; opacity: 0.85; }
  .now .label { font-size: clamp(1.6rem, 3.4vw, 3.2rem); font-weight: 650; line-height: 1.1; }
  .now .others { font-size: clamp(0.9rem, 1.6vw, 1.5rem); opacity: 0.85; }
  .now .merged { font-size: clamp(1rem, 1.8vw, 1.7rem); line-height: 1.3; }
  .status { position: fixed; bottom: 2vh; left: 0; right: 0; text-align: center; color: var(--faint); font-size: 0.95rem; }
  .footer { position: fixed; top: 4.5vh; right: 5vw; max-width: 40vw; text-align: right; color: var(--muted); font-size: clamp(0.7rem, 1.2vw, 1.1rem); }
  /* Very short boxes: keep the code, heading and topic; drop the extras. */
  @media (max-height: 420px) {
    .footer { display: none; }
    body.answering .words p, .now .merged, .now .others { display: none; }
    .now { padding: 1.2vh 2vw; }
  }
  /* Live clock: shows at a glance that the screen is updating. */
  .clock { position: fixed; bottom: 2vh; right: 3vw; color: var(--faint); font-size: clamp(0.7rem, 1.1vw, 1rem); font-variant-numeric: tabular-nums; }
  .clock.stale, .status.stale { color: #e8a13a; }
  body.qr-only .clock { position: static; order: 20; font-size: clamp(0.65rem, 2.6vmin, 1.1rem); }
  /*
   * The room screen may be a projector, a monitor, or a box on a slide of any shape.
   * Wide: text beside the code. Square or tall: text above it, sized to the box.
   */
  @media (max-aspect-ratio: 5/4) {
    /* One column, in reading order, everything in the flow so nothing overlaps. */
    body { flex-direction: column; gap: 1.8vh; padding: 3vh 6vw 5vh; text-align: center; }
    .brand { position: static; order: -2; justify-content: center; flex: 0 0 auto; }
    .brand img { max-height: 7vh; max-width: 60vw; }
    .code, .waiting, .now, .words { flex: 0 0 auto; }
    .words { flex: 0 0 auto; max-width: 90vw; order: -1; }
    h1 { font-size: clamp(1.4rem, 7vw, 4rem); margin-bottom: 0.3em; }
    p { font-size: clamp(0.75rem, 3.1vw, 1.4rem); margin-bottom: 0.2em; }
    .code svg, .code img, .waiting { width: min(32vh, 72vw); }
    body.answering { padding-bottom: 6vh; }
    body.answering .code svg, body.answering .code img, body.answering .waiting { width: min(26vh, 60vw); }
    .now { position: static; order: 5; width: 100%; grid-template-columns: 1fr; text-align: center; padding: 1.6vh 3vw; gap: 0.4vh; }
    .now .tag { grid-row: auto; }
    .now .label { font-size: clamp(1.1rem, 5vw, 2.6rem); }
    .now .others, .now .merged { font-size: clamp(0.75rem, 3vw, 1.3rem); }
    .footer { position: static; order: 10; font-size: clamp(0.7rem, 2.6vw, 1rem); }
    .status { display: none; }
    .clock { position: static; order: 11; }
  }
  /* QR-only in a wide box (a 16:9 slide): caption beside the code, so the code can be big. */
  @media (min-aspect-ratio: 4/3) {
    body.qr-only { flex-direction: row; gap: 4vw; }
    body.qr-only .code svg, body.qr-only .code img, body.qr-only .waiting { width: min(78vh, 56vw); }
    body.qr-only .caption { text-align: left; max-width: 34vw; font-size: clamp(0.8rem, 3.4vw, 2.4rem); }
    body.qr-only .clock { position: fixed; bottom: 2vh; right: 3vw; }
  }
</style>
</head>
<body class="dark">

<div class="band"></div>
<div class="brand" id="brand" hidden>
  <img id="logo" alt="" hidden>
  <span id="org"></span>
</div>
<div class="footer" id="footer" hidden></div>

<div class="words">
  <h1 id="heading">Ask the panel</h1>
  <p lang="en">Point your camera at the code. Ask in any language.</p>
  <p lang="ko">카메라로 코드를 스캔하세요. 어떤 언어로도 질문할 수 있습니다.</p>
  <p lang="es">Apunta la cámara al código. Pregunta en cualquier idioma.</p>
</div>

<div class="code" id="code" hidden></div>
<div class="waiting" id="waiting"></div>

<div class="now" id="now" hidden>
  <div class="tag">Now answering</div>
  <div class="label" id="nowLabel"></div>
  <div class="others" id="nowOthers"></div>
  <div class="merged" id="nowMerged" hidden></div>
</div>

<div class="caption" id="caption" lang="en">Scan to ask a question<br><span lang="ko">질문하려면 스캔하세요</span> · <span lang="es">Escanea para preguntar</span></div>

<div class="status" id="status"></div>
<div class="clock" id="clock" aria-live="off"></div>

<script>
  var BOOT = <?!= boot ?>;

  var box = document.getElementById('code');
  var waiting = document.getElementById('waiting');
  var status = document.getElementById('status');
  var shownUrl = '';
  var theme = BOOT.theme || 'dark';
  var brand = BOOT.brand;
  var themeOverride = null;   // press T to flip locally, e.g. if the projector washes out

  function inkFor(hex) {
    var h = String(hex || '').replace('#', '');
    var r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
    return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? '#16202b' : '#ffffff';
  }

  function applyTheme() {
    var t = themeOverride || theme;
    var idle = document.body.classList.contains('idle');
    var qrOnly = BOOT.layout === 'qr';
    document.body.className = t + (qrOnly ? ' qr-only' : (document.getElementById('now').hidden ? '' : ' answering')) + (idle ? ' idle' : '');
    var s = document.body.style;
    s.setProperty('--bg', t === 'light' ? brand.roomBgLight : brand.roomBgDark);
    s.setProperty('--accent', brand.accent);
    s.setProperty('--accent-ink', inkFor(brand.accent));
    // A custom background can be light in dark mode or vice versa; keep text readable.
    var bgInk = inkFor(t === 'light' ? brand.roomBgLight : brand.roomBgDark);
    s.setProperty('--ink', bgInk);
    s.setProperty('--muted', bgInk === '#ffffff' ? '#9dabb8' : '#5c6874');
    s.setProperty('--faint', bgInk === '#ffffff' ? '#4d5b69' : '#9aa4ad');
  }

  function applyBrand() {
    // Most logos already contain the name; show the text only when there is no logo.
    document.getElementById('org').textContent = brand.logo ? '' : (brand.orgName || '');
    document.getElementById('brand').hidden = !(brand.logo || brand.orgName);
    var footer = document.getElementById('footer');
    footer.textContent = brand.footer || '';
    footer.hidden = !brand.footer;
  }

  if (brand.logo) {
    var logo = document.getElementById('logo');
    logo.src = brand.logo;
    logo.alt = brand.orgName;
    logo.hidden = false;
  }
  applyBrand();
  applyTheme();

  // A projector never needs a pointer; hide it after a few still seconds.
  var idleTimer = null;
  document.addEventListener('mousemove', function () {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { document.body.classList.add('idle'); }, 3000);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 't' || e.key === 'T') {
      themeOverride = (themeOverride || theme) === 'dark' ? 'light' : 'dark';
      applyTheme();
    }
  });

  // qrcode.js draws a canvas and an image and hides one; some web views (PowerPoint on
  // Mac) showed both, stacked. We use the library only for the pattern and draw a single SVG.
  var scratch = document.createElement('div');
  var SVG_NS = 'http://www.w3.org/2000/svg';

  function render(url) {
    if (url === shownUrl) return;
    shownUrl = url;
    scratch.innerHTML = '';
    var generator = new QRCode(scratch, { text: url, width: 64, height: 64, correctLevel: QRCode.CorrectLevel.M });
    var model = generator._oQRCode;
    while (box.firstChild) box.removeChild(box.firstChild);

    if (!model || !model.getModuleCount) {
      // Library internals changed: fall back to its own image (the canvas is hidden by CSS).
      var img = scratch.querySelector('img');
      if (img) box.appendChild(img);
      return;
    }
    var n = model.getModuleCount();
    var d = '';
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        if (model.isDark(r, c)) d += 'M' + c + ' ' + r + 'h1v1h-1z';
      }
    }
    var svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + n + ' ' + n);
    svg.setAttribute('shape-rendering', 'crispEdges');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', 'QR code to ask a question');
    var bg = document.createElementNS(SVG_NS, 'rect');
    bg.setAttribute('width', n);
    bg.setAttribute('height', n);
    bg.setAttribute('fill', '#fff');
    var path = document.createElementNS(SVG_NS, 'path');
    path.setAttribute('d', d);
    path.setAttribute('fill', '#000');
    svg.appendChild(bg);
    svg.appendChild(path);
    box.appendChild(svg);
  }

  function showWaiting(text) {
    box.hidden = true;
    waiting.hidden = false;
    waiting.textContent = text;
    shownUrl = '';
  }

  function showNow(now) {
    var panel = document.getElementById('now');
    panel.hidden = !now;
    if (now) {
      document.getElementById('nowLabel').textContent = now.labels.en;
      var others = [];
      if (now.labels.ko && now.labels.ko !== now.labels.en) others.push(now.labels.ko);
      if (now.labels.es && now.labels.es !== now.labels.en) others.push(now.labels.es);
      document.getElementById('nowOthers').textContent = others.join('  ·  ');
      var merged = document.getElementById('nowMerged');
      merged.hidden = !now.merged;
      if (now.merged) merged.textContent = now.merged.en;
    }
    applyTheme();
  }

  // Refresh loop with a watchdog. google.script.run can hang without calling either
  // handler (sleeping laptop, PowerPoint pausing its web view, flaky wifi); a hung call
  // must never leave an expired code on screen.
  var lastOk = 0;          // when the server last answered
  var requestId = 0;       // answers to superseded requests are ignored
  var requestedAt = 0;
  var nextTimer = null;
  var ended = false;

  function schedule(seconds) {
    clearTimeout(nextTimer);
    nextTimer = setTimeout(refresh, seconds * 1000);
  }

  function refresh() {
    var id = ++requestId;
    requestedAt = Date.now();
    google.script.run.withSuccessHandler(function (screen) {
      if (id !== requestId) return;
      lastOk = Date.now();
      theme = screen.theme;
      screen.brand.logo = brand.logo;
      brand = screen.brand;
      applyBrand();
      document.getElementById('heading').textContent = screen.heading;
      showNow(screen.status === 'active' ? screen.nowAnswering : null);

      if (screen.status === 'ended') {
        ended = true;
        showWaiting('This session has ended');
        status.textContent = '';
      } else if (screen.status !== 'active' || !screen.url) {
        showWaiting('Questions open soon');
        status.textContent = 'Waiting for this session to start';
      } else {
        render(screen.url);
        waiting.hidden = true;
        box.hidden = false;
        status.textContent = screen.open ? 'Code refreshes automatically' : 'Questions are paused';
      }
      tick();
      if (!ended) schedule(screen.refreshInSeconds);
    }).withFailureHandler(function () {
      if (id !== requestId) return;
      status.textContent = 'Lost connection — retrying';
      schedule(15);
    }).getRoomScreen(BOOT.sid);
  }

  function clockText(ms) {
    return new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  }

  function tick() {
    var now = Date.now();
    var clock = document.getElementById('clock');
    var stale = !ended && lastOk && now - lastOk > 60000;
    clock.textContent = clockText(now) + (lastOk ? ' · code updated ' + clockText(lastOk) : '');
    clock.className = stale ? 'clock stale' : 'clock';
    if (stale) {
      status.textContent = 'Not updating — check the internet connection. This code may have expired.';
      status.className = 'status stale';
      box.style.opacity = '0.35';
    } else {
      status.className = 'status';
      box.style.opacity = '';
    }
  }

  setInterval(function () {
    tick();
    if (ended) return;
    var now = Date.now();
    // A call that hasn't answered in 40 s is treated as lost: ask again. (No page
    // reload: inside Google's sandboxed frame that can leave the screen blank.)
    if (now - requestedAt > 40000) refresh();
  }, 1000);

  showWaiting('Loading…');
  refresh();
</script>
</body>
</html>
