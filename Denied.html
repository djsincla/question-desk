<!DOCTYPE html>
<html>
<head>
<base target="_top">
<?!= styles ?>
<style>
  body { padding: 15vh 24px; max-width: 30rem; margin-inline: auto; }
  .logo { display: block; max-height: 48px; max-width: 200px; margin-bottom: 24px; }
  h1 { font-size: 1.3rem; margin: 0 0 8px; font-weight: 600; }
  p { color: var(--muted); margin: 0; }
  ul { list-style: none; padding: 0; margin: 20px 0 0; }
  li { border: 1px solid var(--rule); border-radius: var(--radius-sm); margin-bottom: 8px; background: var(--card); box-shadow: var(--shadow-sm); overflow: hidden; }
  li a { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; color: var(--ink); text-decoration: none; transition: background-color 0.12s var(--ease); }
  li a:hover { background: var(--action-soft); }
  li span { color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
  <img class="logo" id="logo" alt="" hidden>
  <h1 id="heading"></h1>
  <p id="body"></p>
  <ul id="links"></ul>

<script>
  var BOOT = <?!= boot ?>;

  document.getElementById('heading').textContent = BOOT.heading;
  document.getElementById('body').textContent = BOOT.body;
  if (BOOT.brand.logo) {
    var logo = document.getElementById('logo');
    logo.src = BOOT.brand.logo;
    logo.alt = BOOT.brand.orgName;
    logo.hidden = false;
  }

  var list = document.getElementById('links');
  (BOOT.links || []).forEach(function (link) {
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.href = link.href;
    a.textContent = link.label;
    var note = document.createElement('span');
    note.textContent = link.note;
    a.appendChild(note);
    li.appendChild(a);
    list.appendChild(li);
  });
</script>
</body>
</html>
