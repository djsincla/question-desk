<!DOCTYPE html>
<!--
  On your own site, lock this page to your Question Desk.

  Google Apps Script version: put your deployment ID (the part of your app's address between
  /macros/s/ and /exec) in data-only-deployment. Then nobody can use your site's address to show
  some other Apps Script app. Leave it empty on shared copies.

  WordPress version: put your Question Desk address (e.g. https://example.org/questions/) in
  data-site. Links never carry a site of their own, so this page can only ever show yours.
-->
<html lang="en" data-only-deployment="" data-site="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Question Desk</title>
<script src="join-url.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #10171f; }
  /* Question Desk loads inside this frame. Browsers that block third-party cookies
     (Safari, Firefox) send it no Google sign-in, which avoids Google's
     "Sorry, unable to open the file" for people signed into several Google accounts. */
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .problem { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; max-width: 32rem; margin: 18vh auto; padding: 0 24px; }
  .problem h1 { font-size: 1.3rem; margin: 0 0 8px; }
  .problem p { color: #9dabb8; margin: 0; }
</style>
</head>
<body>
<noscript><div class="problem"><h1>JavaScript is needed</h1><p>Turn on JavaScript to ask a question.</p></div></noscript>
<script>
  (function () {
    var root = document.documentElement;
    var url = JoinUrl.target(location.search, root.getAttribute('data-only-deployment'), root.getAttribute('data-site'));
    if (!url) {
      document.body.insertAdjacentHTML('beforeend',
        '<div class="problem"><h1>This link isn’t complete</h1>' +
        '<p>Scan the code on the screen in the room again, or ask the organizer for the link.</p></div>');
      return;
    }
    var frame = null, loadedAt = 0, heardAt = 0, reloadedAt = 0;
    function show() {
      var fresh = document.createElement('iframe');
      fresh.setAttribute('title', 'Question Desk');
      fresh.setAttribute('src', url);
      // Let the embedded page use the keyboard and open links in the whole window.
      fresh.setAttribute('allow', 'clipboard-write');
      if (frame) document.body.replaceChild(fresh, frame); else document.body.appendChild(fresh);
      frame = fresh;
      loadedAt = Date.now();
      heardAt = 0;
    }
    show();

    // A room screen or panelist view left open for hours: reload it when it stops reporting
    // updates (laptop slept, wifi dropped) or reports that Question Desk has a newer version.
    if (!/[?&]view=(present|panel)&/.test(url)) return;
    // Only the screen this page is showing may be heard: Google's own pages for an Apps Script
    // Question Desk, or the site named in data-site for a WordPress one.
    var fromScreen = JoinUrl.origin(url);
    var nested = window.top !== window;
    window.addEventListener('message', function (e) {
      var google = /^https:\/\/(script\.google\.com|[a-z0-9-]+\.googleusercontent\.com)$/.test(e.origin);
      if (!google && e.origin !== fromScreen) return;
      if (!e.data || typeof e.data.questionDesk !== 'string') return;
      heardAt = Date.now();
      // Inside another page (the PowerPoint add-in): that page does the reloading, but it can
      // only check the origin it framed — this one — so the screen's report is passed on.
      if (nested) {
        try { window.top.postMessage({ questionDesk: e.data.questionDesk, version: e.data.version || '' }, '*'); } catch (err) {}
        return;
      }
      if (e.data.questionDesk === 'outdated' && Date.now() - reloadedAt > 10 * 60000) { reloadedAt = Date.now(); show(); }
    });
    if (nested) return;
    setInterval(function () {
      if (Date.now() - Math.max(heardAt, loadedAt) > 3 * 60000) show();
    }, 5000);
  })();
</script>
</body>
</html>
