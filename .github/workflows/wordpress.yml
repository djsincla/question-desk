name: wordpress

on:
  push:
    branches: [wordpress]
  pull_request:
    branches: [wordpress]

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install tools
        run: npm ci && npx playwright install --with-deps webkit chromium
      - name: Secret scan and the Apps Script tests the plugin builds from
        run: node scripts/check-secrets.js && node --test tests/*.test.js
      - name: Start WordPress (wp-env)
        run: npm run wp:start
      - name: Plugin tests (PHPUnit in WordPress)
        run: npm run wp:test
      - name: Build the installable zip
        run: npm run wp:package

      - name: Plugin in real browsers
        run: npm run wp:browsers
